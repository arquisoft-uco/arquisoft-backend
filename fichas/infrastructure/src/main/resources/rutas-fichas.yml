# ==================== RUTAS DE CONTROLADORES — CONTEXTO FICHAS ====================
# Un placeholder por segmento de path. OpenApiConfig lee la clave base via @Value
# para no duplicar el literal entre el controlador REST y la agrupacion de Swagger.
# Vive en este modulo (no en el application.yml raiz) para que, si este contexto se
# extrae a microservicio, se lleve su propia configuracion de rutas consigo.
rutas:
  fichas:
    fichas-perfil:
      base: /fichas-perfil
      por-id: /{id}
      asesor-ficha: /{id}/asesor-ficha
      coordinador: /coordinador
      asesor: /asesor
      estados-ficha: /estados-ficha
      tipos-item: /tipos-item
      estados-evaluacion: /estados-evaluacion
      items: /{fichaPerfilId}/items
      items-estudiante: /{fichaPerfilId}/items/estudiante
      items-representante: /{fichaPerfilId}/items/representante
      item-por-id: /items/{itemId}
      item-revisiones: /items/{itemId}/revisiones
      estudiantes: /{fichaPerfilId}/estudiantes
      estudiante-por-id: /{fichaPerfilId}/estudiantes/{estudianteId}
      evaluaciones: /{fichaId}/evaluaciones
      evaluaciones-representante: /{fichaPerfilId}/evaluaciones/representante
      ficha-estudiante: /{fichaPerfilId}/estudiante
    estado-evaluacion-ficha:
      base: ${rutas.fichas.fichas-perfil.base}/estado-evaluacion-ficha
    minio-guia:
      base: /fichas/minio/guia
      upload-url: /upload-url
      download-url: /download-url
      existe: /existe
      objeto: /objeto
