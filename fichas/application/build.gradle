dependencies {
    implementation project(':fichas:domain')
    implementation project(':shared:domain')
    implementation project(':shared:query')

    implementation project(':shared:logger')

    // Entity JPA: las entidades viven en secondaryport/entity, asi que este modulo necesita las
    // anotaciones @Entity/@Column — solo la API, no el starter de datos completo.
    implementation "jakarta.persistence:jakarta.persistence-api"

    // Transactional — solo necesitamos @Transactional, no todo el starter
    implementation 'org.springframework:spring-tx'

    // Testing — junit-platform-launcher requerido explicitamente por Gradle 9
    testRuntimeOnly "org.junit.platform:junit-platform-launcher"
}