dependencies {
    implementation project(':shared:domain')

    // Domain puro: sin dependencias de framework
    // - Las excepciones de dominio extienden DomainException (shared:exception, transitivo por
    //   'api' de shared:domain)
    // - Validator*/ValidationResult (shared:validation) acumulan los errores de invariante

    // Test: AssertJ + JUnit launcher (versiones gestionadas por BOM heredado del raiz)
    testImplementation "org.assertj:assertj-core"
    testRuntimeOnly "org.junit.platform:junit-platform-launcher"
    testRuntimeOnly "org.junit.jupiter:junit-jupiter-engine"
}