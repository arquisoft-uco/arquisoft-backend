dependencies {
    implementation project(':shared:domain')
    implementation project(':shared:exceptions')
    implementation project(':shared:validation')

    // Domain puro: sin dependencias de framework
    // - Las excepciones de dominio extienden DomainException (shared:exceptions)
    // - DomainValidator (shared:validation) centraliza los guards de invariantes

    // Test: AssertJ + JUnit launcher (versiones gestionadas por BOM heredado del raiz)
    testImplementation "org.assertj:assertj-core"
    testRuntimeOnly "org.junit.platform:junit-platform-launcher"
    testRuntimeOnly "org.junit.jupiter:junit-jupiter-engine"
}