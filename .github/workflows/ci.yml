# ==============================================================================
# Arquisoft Backend — CI Pipeline
# ==============================================================================
# Ejecuta linting, tests y build en cada push/PR
# Runner: GitHub-hosted (ubuntu-latest) — gratis
# ==============================================================================

name: CI Backend

on:
  push:
    branches: ['**']
  pull_request:
    branches: [develop, main]

concurrency:
  group: ci-backend-${{ github.ref }}
  # En develop no se cancela: cada merge debe quedar con su propio veredicto de CI.
  cancel-in-progress: ${{ github.ref != 'refs/heads/develop' }}

jobs:
  # ============================================================================
  # Versionamiento Flyway — job propio: corre en segundos y sin Java, así un error
  # de migración se ve antes de que termine el build.
  # ============================================================================
  flyway:
    name: Versionamiento Flyway
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout código
        uses: actions/checkout@v4
        with:
          # Historial completo: el check de inmutabilidad compara contra la rama destino.
          fetch-depth: 0

      - name: Validar migraciones
        run: |
          BASE="${{ github.base_ref || github.event.repository.default_branch }}"
          git fetch --no-tags origin "$BASE"
          bash scripts/validar-migraciones.sh "origin/$BASE"

  build:
    name: Lint, Test & Build
    runs-on: ubuntu-latest
    # Margen para el análisis de SonarQube en los push a develop.
    timeout-minutes: 30

    steps:
      # ── Checkout ──
      - name: Checkout código
        uses: actions/checkout@v4
        with:
          # Historial completo: SonarQube usa el blame de git para atribuir issues y
          # distinguir el código nuevo del existente.
          fetch-depth: 0

      # ── Setup Java 25 ──
      - name: Setup Java 25 (Temurin)
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'

      # ── Cache Gradle ──
      - name: Cache Gradle dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties', 'gradle.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      # ── Permisos Gradle Wrapper ──
      - name: Permisos gradlew
        run: chmod +x gradlew

      # ── Lint (Checkstyle) ──
      - name: Lint — Checkstyle
        run: ./gradlew checkstyleMain checkstyleTest --no-daemon
        continue-on-error: false

      # ── Tests ──
      - name: Tests unitarios
        run: ./gradlew test --no-daemon

      # ── Build ──
      - name: Build del proyecto
        run: ./gradlew build -x test --no-daemon

      # ── Análisis SonarQube ──
      # SonarQube Community Build analiza una sola rama por proyecto: se usa develop, que es la
      # rama de integración. Solo corre en push a develop y solo si los secretos están definidos,
      # así el CI no falla mientras el servidor de SonarQube no esté configurado.
      - name: Verificar configuración de SonarQube
        id: sonar-config
        if: github.event_name == 'push' && github.ref == 'refs/heads/develop'
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
        run: |
          if [ -n "$SONAR_TOKEN" ] && [ -n "$SONAR_HOST_URL" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::SONAR_TOKEN o SONAR_HOST_URL no definidos: se omite el análisis de SonarQube."
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Cache SonarQube
        if: steps.sonar-config.outputs.enabled == 'true'
        uses: actions/cache@v4
        with:
          path: ~/.sonar/cache
          key: sonar-${{ runner.os }}
          restore-keys: sonar-${{ runner.os }}

      # Los tests ya corrieron en este job: Gradle los reutiliza (up-to-date) y solo genera
      # los XML de JaCoCo que SonarQube importa como cobertura.
      - name: Análisis SonarQube
        if: steps.sonar-config.outputs.enabled == 'true'
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
        run: ./gradlew jacocoTestReport sonar --no-daemon

      # ── Upload test reports ──
      - name: Upload test reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-reports
          path: '**/build/reports/tests/'
          retention-days: 7

      # ── Upload checkstyle reports ──
      - name: Upload checkstyle reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: checkstyle-reports
          path: '**/build/reports/checkstyle/'
          retention-days: 7
