# ==============================================================================
# Arquisoft Backend — Docker Build & Push
# ==============================================================================
# Construye imagen Docker y la publica en GitHub Container Registry (GHCR).
# Trigger: push a CUALQUIER rama o tag de versión.
# Runner: GitHub-hosted (ubuntu-latest) — gratis
#
# Seguridad:
#   - La imagen NO contiene credenciales: el .dockerignore excluye .env/secretos
#     y la config se inyecta en runtime (docker run --env-file .env).
#   - Este workflow no imprime secretos en los logs (no usa `echo` de variables
#     sensibles; el login usa el GITHUB_TOKEN efímero del runner).
#   - La imagen se publica PÚBLICA: tras el primer push, fijar la visibilidad del
#     paquete a "Public" una sola vez (ver README/instrucciones del repo).
# ==============================================================================

name: Docker Build & Push

on:
  push:
    branches: ['**']
    tags: ['v*']

# Cancela builds en curso de la misma rama/tag (ahorra minutos al construir en todas las ramas)
concurrency:
  group: docker-build-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push:
    name: Build & Push Docker Image
    runs-on: ubuntu-latest
    timeout-minutes: 20

    permissions:
      contents: read
      packages: write

    steps:
      # ── Checkout ──
      - name: Checkout código
        uses: actions/checkout@v4

      # ── Login GHCR ──
      - name: Login a GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # ── Buildx ──
      - name: Configurar Docker Buildx
        uses: docker/setup-buildx-action@v3

      # ── Metadata (tags y labels) ──
      - name: Extraer metadata Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          # El nombre del paquete se normaliza a minúsculas (requisito de GHCR)
          tags: |
            # cualquier rama → <slug-de-rama>  (feature/hu-206 → feature-hu-206)
            type=ref,event=branch
            # trazabilidad: sha-<sha-corto> en cada push (prefijo estático válido)
            type=sha,prefix=sha-,format=short
            # main → latest
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            # tags de versión → v1.0.0 y v1.0
            type=semver,pattern=v{{version}}
            type=semver,pattern=v{{major}}.{{minor}}

      # ── Build & Push ──
      - name: Build y push imagen Docker
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
