# ==============================================================================
# Arquisoft Backend — Docker Build & Push
# ==============================================================================
# Construye imagen Docker y la publica en GitHub Container Registry (GHCR)
# Trigger: merge a develop/main o tag de versión
# Runner: GitHub-hosted (ubuntu-latest) — gratis
# ==============================================================================

name: Docker Build & Push

on:
  push:
    branches: [develop, main]
    tags: ['v*']

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push:
    name: Build & Push Docker Image
    runs-on: ubuntu-latest
    timeout-minutes: 20

    permissions:
      contents: read
      packages: write

    steps:
      # ── Checkout ──
      - name: Checkout código
        uses: actions/checkout@v4

      # ── Login GHCR ──
      - name: Login a GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # ── Buildx ──
      - name: Configurar Docker Buildx
        uses: docker/setup-buildx-action@v3

      # ── Metadata (tags y labels) ──
      - name: Extraer metadata Docker
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            # develop branch → dev-<sha>
            type=sha,prefix=dev-,enable=${{ github.ref == 'refs/heads/develop' }}
            # main branch → latest
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            # version tags → v1.0.0
            type=semver,pattern=v{{version}}
            type=semver,pattern=v{{major}}.{{minor}}

      # ── Build & Push ──
      - name: Build y push imagen Docker
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
