# ==============================================================================
# Arquisoft Backend — Docker Build & Push
# ==============================================================================
# Construye imagen Docker y la publica en GitHub Container Registry (GHCR).
# Trigger: push a CUALQUIER rama o tag de versión.
# Runner: GitHub-hosted (ubuntu-latest) — gratis
#
# Seguridad:
#   - La imagen NO contiene credenciales: el .dockerignore excluye .env/secretos
#     y la config se inyecta en runtime (docker run --env-file .env).
#   - Este workflow no imprime secretos en los logs (no usa `echo` de variables
#     sensibles; el login usa el GITHUB_TOKEN efímero del runner).
#   - La imagen se publica PÚBLICA: tras el primer push, fijar la visibilidad del
#     paquete a "Public" una sola vez (ver README/instrucciones del repo).
# ==============================================================================

name: Docker Build & Push

on:
  push:
    branches: ['**']
    tags: ['v*']

# Cancela builds en curso de la misma rama/tag (ahorra minutos al construir en todas las ramas)
concurrency:
  group: docker-build-${{ github.ref }}
  # En develop no se cancela: cada push publica su sha-<short> y lo despliega
  # (job `deploy`); cancelarlo por el merge siguiente saltaría ese despliegue.
  cancel-in-progress: ${{ github.ref != 'refs/heads/develop' }}

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push:
    name: Build & Push Docker Image
    runs-on: ubuntu-latest
    timeout-minutes: 20

    permissions:
      contents: read
      packages: write

    steps:
      # ── Checkout ──
      - name: Checkout código
        uses: actions/checkout@v4

      # ── Jar compilado en el runner ──
      # Igual que CI Backend (misma caché de Gradle, red del runner). Compilar dentro de
      # BuildKit, sin caché, fallaba de forma intermitente resolviendo dependencias.
      - name: Setup Java 25 (Temurin)
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Cache Gradle dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties', 'gradle.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Compilar jar
        env:
          GITHUB_PACKAGES_USER: ${{ secrets.MESSAGEUCOLAB_PACKAGES_USER }}
          GITHUB_PACKAGES_TOKEN: ${{ secrets.MESSAGEUCOLAB_PACKAGES_TOKEN }}
        run: |
          chmod +x gradlew
          ./gradlew bootJar --no-daemon
          find build/libs -maxdepth 1 -name "*.jar" ! -name "*-plain.jar" -exec cp {} app.jar \;
          test -s app.jar

      # ── Login GHCR ──
      - name: Login a GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # ── QEMU (emulación necesaria para construir arm64 en el runner amd64) ──
      - name: Configurar QEMU
        uses: docker/setup-qemu-action@v3

      # ── Buildx ──
      - name: Configurar Docker Buildx
        uses: docker/setup-buildx-action@v3

      # ── Metadata (tags y labels) ──
      - name: Extraer metadata Docker
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          # El nombre del paquete se normaliza a minúsculas (requisito de GHCR)
          tags: |
            # cualquier rama → <slug-de-rama>  (feature/hu-206 → feature-hu-206)
            type=ref,event=branch
            # trazabilidad: sha-<sha-corto> en cada push (prefijo estático válido)
            type=sha,prefix=sha-,format=short
            # main → latest
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            # tags de versión → v1.0.0 y v1.0
            type=semver,pattern=v{{version}}
            type=semver,pattern=v{{major}}.{{minor}}

      # ── Build & Push ──
      # platforms: el servidor de despliegue (Oracle, Ampere A1) es arm64; se
      # incluye amd64 también para poder correr la imagen en local/x86 sin rebuild.
      - name: Build y push imagen Docker
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Empaqueta el app.jar compilado arriba; no compila dentro de Docker.
          build-args: |
            JAR_ORIGEN=precompilado
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ── Despliegue (solo develop) ──
  # Corre cuando la imagen ya está publicada: sin carrera contra el build.
  # Re-ejecutar un build fallido vuelve a disparar este job.
  deploy:
    name: CD Deploy (SSH)
    needs: build-and-push
    if: github.ref == 'refs/heads/develop'
    uses: ./.github/workflows/deploy.yml
    secrets: inherit
