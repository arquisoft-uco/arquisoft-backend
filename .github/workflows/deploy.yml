# ==============================================================================
# Arquisoft Backend — CD Deploy (SSH)
# ==============================================================================
# Despliega el backend en un servidor remoto por SSH usando la imagen Docker
# publicada en GHCR por el workflow "Docker Build & Push" (docker-build.yml).
#
# Flujo:
#   1. push a develop  →  docker-build.yml construye y publica ghcr.io/<repo>:sha-<short>
#   2. cuando ese build termina con éxito, docker-build.yml invoca este workflow
#      (workflow_call, job `deploy` con `needs: build-and-push`). Se conecta por
#      SSH al servidor, escribe el .env (descargado de Doppler en el propio
#      servidor) y levanta el contenedor con `docker run --env-file`.
#   Manual: workflow_dispatch con image_tag (vacío = sha-<short> del commit).
#
# Por qué se encadena al build y no se dispara por `push` en paralelo:
#   El build multi-arquitectura (arm64 bajo QEMU) tarda 6-7 min y el deploy
#   sondeaba GHCR solo 5 min: la carrera fallaba con "not found" y obligaba a
#   re-ejecutar. Con `needs` el deploy arranca cuando la imagen ya existe, y
#   re-ejecutar un build fallido vuelve a desplegar solo. El pull conserva unos
#   reintentos cortos como red ante latencia del registry.
#
# Por qué se despliega por SHA (sha-<short>) y no por el tag de rama (develop):
#   El tag `develop` es mutable; sha-<short> es inmutable y único por commit.
#
# Secretos requeridos (Settings → Secrets and variables → Actions):
#   SSH_HOST          IP o dominio del servidor              (ej. 203.0.113.10)
#   SSH_USER          usuario SSH                            (ej. deploy)
#   SSH_PORT          puerto SSH                             (ej. 22)
#   SSH_PRIVATE_KEY   clave privada SSH (formato OpenSSH, multilínea)
#   BASE_DOMAIN       dominio base (ej. midominio.com). El backend se expone en
#                     api.<BASE_DOMAIN> vía Traefik (el subdominio "api" es fijo).
#   GHCR_USERNAME     (opcional) usuario GHCR — solo si el paquete es PRIVADO
#   GHCR_TOKEN        (opcional) PAT con read:packages — solo si es PRIVADO
#   DOCKER_NETWORK    (opcional) red Docker de la infra (default: arquisoft-network)
#
# Variables de runtime de la app: en Doppler (proyecto arquisoft-backend, config
# test), NO en GitHub. Prerrequisito en el servidor, como SSH_USER y una sola vez:
#   doppler configure set token <service-token-solo-lectura> --scope $HOME/arquisoft
#
# Cómo apuntar a otro servidor: ver docs/DESPLIEGUE_CD_SSH.md
# ==============================================================================

name: CD Deploy (SSH)

on:
  # Invocado por docker-build.yml tras publicar la imagen de un push a develop.
  workflow_call:
    inputs:
      image_tag:
        description: 'Tag de imagen GHCR a desplegar (vacío = sha-<short> del commit)'
        required: false
        type: string
        default: ''
  workflow_dispatch:
    inputs:
      image_tag:
        description: 'Tag de imagen GHCR a desplegar (vacío = sha-<short> del commit)'
        required: false
        default: ''

jobs:
  deploy:
    name: Deploy a servidor remoto
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Un despliegue a la vez por rama; NO cancelar uno en curso (evita dejar el
    # servidor a mitad de un reemplazo de contenedor). A nivel de job porque el
    # workflow también corre como reusable.
    concurrency:
      group: deploy-${{ github.ref }}
      cancel-in-progress: false

    steps:
      # ── Resolver imagen a desplegar ──
      - name: Resolver referencia de imagen
        id: image
        run: |
          set -euo pipefail
          REPO_LC="$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')"
          if [ -n "${{ inputs.image_tag }}" ]; then
            TAG="${{ inputs.image_tag }}"
          else
            TAG="sha-$(echo '${{ github.sha }}' | cut -c1-7)"
          fi
          echo "ref=ghcr.io/${REPO_LC}:${TAG}" >> "$GITHUB_OUTPUT"
          echo "Imagen objetivo: ghcr.io/${REPO_LC}:${TAG}"

      # ── Despliegue por SSH ──
      # Los secretos de runtime NO pasan por GitHub: el servidor los descarga de
      # Doppler (proyecto arquisoft-backend) con su propio token de solo lectura.
      - name: Desplegar contenedor por SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          port: ${{ secrets.SSH_PORT }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          # Variables forwardeadas a la sesión remota (no se imprimen en logs).
          envs: IMAGE,GHCR_USERNAME,GHCR_TOKEN,DOCKER_NETWORK,BASE_DOMAIN
          script_stop: true
          script: |
            set -euo pipefail

            # Config de Docker aislada y efímera para esta corrida: cualquier
            # credencial de GHCR vive solo aquí y muere con el trap. Evita que un
            # `docker login` deje un token en ~/.docker/config.json del usuario —
            # cuando ese token vence, Docker lo sigue enviando y el registry
            # responde `denied` en vez de caer al pull anónimo.
            export DOCKER_CONFIG="$(mktemp -d)"
            trap 'rm -rf "$DOCKER_CONFIG"' EXIT

            APP_DIR="$HOME/arquisoft"
            CONTAINER="arquisoft-backend"
            APP_PORT="8080"
            # Red Docker donde viven postgres/redis/rabbitmq/keycloak/minio.
            # El backend se une a ella para alcanzarlos por NOMBRE de contenedor.
            NETWORK="${DOCKER_NETWORK:-arquisoft-network}"
            # Subdominio FIJO del backend + dominio base OBLIGATORIO → api.<dominio>
            # Traefik enruta ese host al backend (entrypoint websecure + TLS).
            if [ -z "${BASE_DOMAIN:-}" ]; then
              echo "✖ Falta el secreto BASE_DOMAIN (dominio base, ej. midominio.com)"; exit 1
            fi
            APP_DOMAIN="api.${BASE_DOMAIN}"

            mkdir -p "$APP_DIR"

            # 1) .env de runtime desde Doppler. El token de SOLO LECTURA vive en el
            #    servidor (`doppler configure set token --scope $APP_DIR`), no en GitHub.
            #    Se escribe a un temporal y se valida ANTES de tocar el contenedor: si
            #    Doppler falla, el backend actual sigue corriendo con su .env previo.
            #    --format docker = KEY=valor sin comillas (lo que espera --env-file).
            command -v doppler >/dev/null || {
              echo "✖ Doppler CLI no instalado en el servidor (ver docs/DESPLIEGUE_CD_SSH.md §3)"; exit 1; }
            ENV_TMP="$(mktemp "$APP_DIR/.env.XXXXXX")"   # mktemp crea el archivo en modo 600
            if ! ( cd "$APP_DIR" && doppler secrets download --no-file --format docker \
                     --no-fallback --no-check-version --silent ) > "$ENV_TMP"; then
              rm -f "$ENV_TMP"
              echo "✖ No se pudieron obtener los secretos de Doppler (¿token configurado para $APP_DIR?)"; exit 1
            fi
            sed -i -E '/^DOPPLER_(PROJECT|CONFIG|ENVIRONMENT)=/d' "$ENV_TMP"
            if ! grep -qE '^DB_USUARIOS_PASSWORD=.' "$ENV_TMP"; then
              rm -f "$ENV_TMP"; echo "✖ Secretos de Doppler incompletos (falta DB_USUARIOS_PASSWORD)"; exit 1
            fi
            mv "$ENV_TMP" "$APP_DIR/.env"
            echo "✔ .env escrito en $APP_DIR/.env desde Doppler ($(grep -c '=' "$APP_DIR/.env") variables)"

            # 2) Login a GHCR solo si el paquete es privado (credenciales provistas)
            if [ -n "${GHCR_TOKEN:-}" ]; then
              echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USERNAME" --password-stdin
              echo "✔ Login GHCR realizado"
            fi

            # 3) Descargar la imagen (tag inmutable sha-<short>). El build ya terminó
            #    (needs en docker-build.yml); los reintentos cubren latencia del registry.
            echo "Descargando imagen $IMAGE ..."
            PULLED=0
            for i in $(seq 1 6); do
              if docker pull "$IMAGE"; then PULLED=1; break; fi
              echo "  imagen aún no disponible (intento $i/6), espero 10s..."
              sleep 10
            done
            if [ "$PULLED" -ne 1 ]; then
              echo "✖ La imagen $IMAGE no se publicó a tiempo"; exit 1
            fi

            # 4) Reemplazar el contenedor
            docker rm -f "$CONTAINER" 2>/dev/null || true
            # Puerto publicado SOLO en loopback: el health check del host funciona,
            # pero el tráfico externo entra por Traefik (443), no directo al 8080.
            docker run -d \
              --name "$CONTAINER" \
              --restart unless-stopped \
              --env-file "$APP_DIR/.env" \
              --network "$NETWORK" \
              -p "127.0.0.1:${APP_PORT}:8080" \
              --add-host=host.docker.internal:host-gateway \
              --label "traefik.enable=true" \
              --label "traefik.docker.network=${NETWORK}" \
              --label "traefik.http.routers.arquisoft-backend.rule=Host(\`${APP_DOMAIN}\`) && !PathPrefix(\`/api/actuator\`)" \
              --label "traefik.http.routers.arquisoft-backend.entrypoints=websecure" \
              --label "traefik.http.routers.arquisoft-backend.tls=true" \
              --label "traefik.http.routers.arquisoft-backend.tls.certresolver=letsencrypt" \
              --label "traefik.http.services.arquisoft-backend.loadbalancer.server.port=8080" \
              "$IMAGE"
            echo "✔ Contenedor $CONTAINER levantado con $IMAGE"

            # 5) Verificar health (Spring Boot tarda ~60s con Flyway y varias DBs)
            echo "Verificando health en http://localhost:${APP_PORT}/api/actuator/health ..."
            OK=0
            for i in $(seq 1 30); do
              if curl -fsS "http://localhost:${APP_PORT}/api/actuator/health" >/dev/null 2>&1; then
                OK=1; break
              fi
              sleep 5
            done
            if [ "$OK" -ne 1 ]; then
              echo "✖ Health check falló. Últimos logs:"; docker logs --tail 80 "$CONTAINER"; exit 1
            fi
            echo "✔ Backend saludable"

            # 6) Limpieza de imágenes colgadas
            docker image prune -f >/dev/null 2>&1 || true
            # Sin logout: el trap borra el DOCKER_CONFIG efímero de esta corrida.
        env:
          IMAGE: ${{ steps.image.outputs.ref }}
          GHCR_USERNAME: ${{ secrets.GHCR_USERNAME }}
          GHCR_TOKEN: ${{ secrets.GHCR_TOKEN }}
          DOCKER_NETWORK: ${{ secrets.DOCKER_NETWORK }}
          BASE_DOMAIN: ${{ secrets.BASE_DOMAIN }}
