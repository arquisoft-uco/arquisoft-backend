<table role="presentation" width="100%" cellpadding="0" cellspacing="0"
       style="background-color: #f3f4f6; margin: 0; padding: 0;">
  <tr>
    <td align="center" style="padding: 32px 16px;">
      <table role="presentation" width="100%" cellpadding="0" cellspacing="0"
             style="max-width: 560px; background-color: #ffffff; border-radius: 8px;
                    font-family: -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
        <tr>
          <td style="padding: 32px 32px 16px 32px; font-size: 18px; font-weight: 600;
                     color: #111827;">
            {{titulo}}
          </td>
        </tr>
        <tr>
          <td style="padding: 0 32px 24px 32px; font-size: 15px; line-height: 1.6;
                     color: #374151; white-space: pre-line;">
            {{cuerpo}}
          </td>
        </tr>
        <tr>
          <td style="padding: 16px 32px 32px 32px; border-top: 1px solid #e5e7eb;
                     font-size: 12px; line-height: 1.5; color: #6b7280;">
            {{pie}}
          </td>
        </tr>
      </table>
    </td>
  </tr>
</table>
