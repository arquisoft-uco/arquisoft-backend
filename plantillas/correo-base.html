<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="color-scheme" content="light">
  <meta name="supported-color-schemes" content="light">
</head>
<body style="margin: 0; padding: 0; background-color: #eef1ef;">
  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0"
         style="background-color: #eef1ef; margin: 0; padding: 0;">
    <tr>
      <td align="center" style="padding: 32px 16px;">
        <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0"
               style="max-width: 600px; background-color: #ffffff; border-radius: 8px;
                      border: 1px solid #dfe5e1; border-collapse: separate;">
          <tr>
            <td style="background-color: #024426; border-radius: 8px 8px 0 0;
                       padding: 28px 32px 24px 32px;
                       font-family: 'Montserrat', 'Segoe UI', Helvetica, Arial, sans-serif;
                       font-size: 20px; font-weight: 700; line-height: 1.35;
                       color: #ffffff;">
              {{titulo}}
            </td>
          </tr>
          <tr>
            <td style="background-color: #ffca00; height: 6px; line-height: 6px;
                       font-size: 0;">&nbsp;</td>
          </tr>
          <tr>
            <td style="padding: 32px 32px 28px 32px;
                       font-family: 'Poppins', 'Segoe UI', Helvetica, Arial, sans-serif;
                       font-size: 15px; line-height: 1.65; color: #1f2933;
                       white-space: pre-line;">
              {{cuerpo}}
            </td>
          </tr>
          <tr>
            <td style="background-color: #f3f6f4; border-top: 2px solid #008b50;
                       border-radius: 0 0 8px 8px; padding: 20px 32px 24px 32px;
                       font-family: 'Poppins', 'Segoe UI', Helvetica, Arial, sans-serif;
                       font-size: 12px; line-height: 1.6; color: #4a5550;">
              {{pie}}
            </td>
          </tr>
        </table>
      </td>
    </tr>
  </table>
</body>
</html>
