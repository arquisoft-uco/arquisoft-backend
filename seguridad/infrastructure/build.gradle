dependencies {
    implementation project(':seguridad:domain')
    implementation project(':seguridad:application')
    implementation project(':shared:exceptions')

    // Spring Security & OAuth2
    implementation "org.springframework.boot:spring-boot-starter-security:${springBootVersion}"
    implementation "org.springframework.boot:spring-boot-starter-oauth2-resource-server:${springBootVersion}"
    implementation "org.springframework.boot:spring-boot-starter-validation:${springBootVersion}"

    // JWT
    implementation "io.jsonwebtoken:jjwt-api:${jjwtVersion}"
    runtimeOnly "io.jsonwebtoken:jjwt-impl:${jjwtVersion}"
    runtimeOnly "io.jsonwebtoken:jjwt-jackson:${jjwtVersion}"

    // Rate Limiting
    implementation "com.github.vladimir-bukhtoyarov:bucket4j-core:${bucket4jVersion}"

    // Database
    implementation "org.springframework.boot:spring-boot-starter-data-jpa:${springBootVersion}"
    implementation "org.flywaydb:flyway-core:${flywaydbVersion}"
    implementation "org.flywaydb:flyway-database-postgresql:${flywaydbVersion}"
    runtimeOnly "org.postgresql:postgresql:${postgresVersion}"

    // OpenAPI / Swagger (ADR-011)
    implementation "org.springdoc:springdoc-openapi-starter-webmvc-ui:${springdocVersion}"

    // Testing
    testImplementation platform("org.springframework.boot:spring-boot-dependencies:${springBootVersion}")
    testImplementation "org.springframework.security:spring-security-test"
    testImplementation "com.h2database:h2:${h2Version}"
    testRuntimeOnly "org.junit.platform:junit-platform-launcher"
}
