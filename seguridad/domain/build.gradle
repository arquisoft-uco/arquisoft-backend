dependencies {
    implementation project(':shared:domain')

    // Domain puro: sin dependencias de framework
    // - Las excepciones de dominio extienden DomainException (shared:domain → exceptions)
    // - Los puertos usan solo tipos de Java stdlib (Map, List, String)

    // Test: AssertJ + JUnit launcher (versiones gestionadas por BOM heredado del raiz)
    // junit-platform-launcher requerido explicitamente por Gradle 9 en modulos sin
    // spring-boot-starter-test
    testImplementation "org.assertj:assertj-core"
    testRuntimeOnly "org.junit.platform:junit-platform-launcher"
    testRuntimeOnly "org.junit.jupiter:junit-jupiter-engine"
}