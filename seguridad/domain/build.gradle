dependencies {
    implementation project(':shared:domain')

    // Domain puro: sin dependencias de framework
    // Las excepciones extienden RuntimeException (Java puro)
    // Los puertos usan solo tipos de Java stdlib (Map, List, String)
    // El enum UserRole es Java puro

    // Test: AssertJ + JUnit launcher (versiones gestionadas por BOM de Spring Boot)
    // junit-platform-launcher requerido explícitamente por Gradle 9 en módulos sin spring-boot-starter-test
    testImplementation platform("org.springframework.boot:spring-boot-dependencies:${springBootVersion}")
    testImplementation "org.assertj:assertj-core"
    testRuntimeOnly "org.junit.platform:junit-platform-launcher"
    testRuntimeOnly "org.junit.jupiter:junit-jupiter-engine"
}
