dependencies {
    implementation project(':seguridad:domain')
    implementation project(':shared:application')
    implementation project(':shared:logger')

    // spring-tx solo en test: InteractoresSeguridadTest verifica que ningun interactor lleve
    // @Transactional (seguridad no tiene DataSource)
    testImplementation 'org.springframework:spring-tx'

    // Testing — junit-platform-launcher requerido explicitamente por Gradle 9
    testRuntimeOnly "org.junit.platform:junit-platform-launcher"
}