dependencies {
    implementation project(':seguridad:domain')
    implementation project(':shared:domain')   // EventPublisher (puerto de salida de eventos)

    // Transactional — solo necesitamos @Transactional, no todo el starter
    implementation 'org.springframework:spring-tx'

    // Jakarta validation para DTOs de comandos
    implementation "org.springframework.boot:spring-boot-starter-validation"

    // Testing — junit-platform-launcher requerido explicitamente por Gradle 9
    testRuntimeOnly "org.junit.platform:junit-platform-launcher"
}