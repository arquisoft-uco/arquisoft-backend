services:
  # ==================== POSTGRESQL ====================
  postgres:
    image: postgres:18-alpine
    container_name: arquisoft-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: arquisoft123
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
      - ./init-db.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - arquisoft-network
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres && psql -U postgres -c \"SELECT 1 FROM pg_database WHERE datname='keycloak'\" | grep -q 1" ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  # ==================== RABBITMQ ====================
  rabbitmq:
    image: rabbitmq:4.2.5-management-alpine
    container_name: arquisoft-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    networks:
      - arquisoft-network
    healthcheck:
      test: rabbitmq-diagnostics -q ping
      interval: 10s
      timeout: 5s
      retries: 5

  # ==================== REDIS ====================
  redis:
    image: redis:7-alpine
    container_name: arquisoft-redis
    command: redis-server --requirepass default123
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - arquisoft-network
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "default123", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ==================== CARGADOR DEL CATÁLOGO DE MENSAJES (ADR-013) ====================
  # Un solo disparo: carga el catálogo en Redis y termina. El backend lo espera con
  # service_completed_successfully porque con el fail-fast de arranque no puede levantar sin
  # catálogo — sin esta compuerta arrancaría antes de la carga y moriría en bucle.
  #
  # Solo afecta al flujo local con docker-compose. Contra la instancia en la nube, el mismo script
  # se ejecuta suelto como paso previo del despliegue.
  catalogo-loader:
    image: redis:7-alpine
    container_name: arquisoft-catalogo-loader
    restart: "no"
    environment:
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: default123
    volumes:
      - ./catalogo:/catalogo:ro
    command: ["sh", "/catalogo/cargar.sh"]
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - arquisoft-network

  # Poda del catálogo: borra de Redis las claves que ya no están en los .properties.
  # Bajo perfil 'mantenimiento' a propósito — 'docker compose up' NO debe borrar nada por su
  # cuenta. Se invoca a mano:  docker compose --profile mantenimiento up catalogo-podador
  # Para ver qué borraría sin borrarlo, añadir DRY_RUN=1 al environment.
  catalogo-podador:
    image: redis:7-alpine
    container_name: arquisoft-catalogo-podador
    restart: "no"
    profiles: ["mantenimiento"]
    environment:
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: default123
      DRY_RUN: "${DRY_RUN:-0}"
    volumes:
      - ./catalogo:/catalogo:ro
    command: ["sh", "/catalogo/podar.sh"]
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - arquisoft-network

  # ==================== KEYCLOAK ====================
  keycloak:
    image: quay.io/keycloak/keycloak:26.6
    container_name: arquisoft-keycloak
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak
      KC_DB_USERNAME: arquisoft
      KC_DB_PASSWORD: arquisoft123
      KC_PROXY_HEADERS: xforwarded
      KC_LOG_LEVEL: INFO
    ports:
      - "8081:8080"
    command: start-dev
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - arquisoft-network
    healthcheck:
      test: [ "CMD-SHELL", "curl -sf http://localhost:8080/health/ready || exit 1" ]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 60s

  # ==================== MINIO ====================
  minio:
    image: 'pgsty/minio:RELEASE.2026-04-17T00-00-00Z'
    container_name: minio
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
      TZ: America/Bogota
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"
    networks:
      - arquisoft-network
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9000/minio/health/live || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  # ==================== MAILPIT (servidor SMTP de desarrollo) ====================
  # Captura todo el correo que envía el backend y lo muestra en una bandeja web.
  # Nada sale a internet: permite probar la entrega real sin escribirle a una persona.
  mailpit:
    image: axllent/mailpit:latest
    container_name: arquisoft-mailpit
    environment:
      TZ: America/Bogota
      MP_MAX_MESSAGES: 500
      MP_SMTP_AUTH_ACCEPT_ANY: 1
      MP_SMTP_AUTH_ALLOW_INSECURE: 1
    ports:
      - "1025:1025"   # SMTP
      - "8025:8025"   # Bandeja web — http://localhost:8025
    networks:
      - arquisoft-network
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # ==================== BACKEND ====================
  arquisoft-backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: arquisoft-backend
    environment:
      DB_USUARIOS_URL: jdbc:postgresql://postgres:5432/usuarios
      DB_USUARIOS_USERNAME: arquisoft_user
      DB_USUARIOS_PASSWORD: arquisoft123
      DB_FICHAS_URL: jdbc:postgresql://postgres:5432/fichas_perfil
      DB_FICHAS_USERNAME: arquisoft_user
      DB_FICHAS_PASSWORD: arquisoft123
      DB_PROYECTOS_URL: jdbc:postgresql://postgres:5432/proyectos_grado
      DB_PROYECTOS_USERNAME: arquisoft_user
      DB_PROYECTOS_PASSWORD: arquisoft123
      DB_ARTEFACTOS_URL: jdbc:postgresql://postgres:5432/artefactos
      DB_ARTEFACTOS_USERNAME: arquisoft_user
      DB_ARTEFACTOS_PASSWORD: arquisoft123
      DB_REPO_ARTEFACTOS_URL: jdbc:postgresql://postgres:5432/repositorio_artefactos
      DB_REPO_ARTEFACTOS_USERNAME: arquisoft_user
      DB_REPO_ARTEFACTOS_PASSWORD: arquisoft123
      DB_ENTREGABLES_URL: jdbc:postgresql://postgres:5432/entregables
      DB_ENTREGABLES_USERNAME: arquisoft_user
      DB_ENTREGABLES_PASSWORD: arquisoft123
      DB_EVALUACIONES_URL: jdbc:postgresql://postgres:5432/evaluaciones
      DB_EVALUACIONES_USERNAME: arquisoft_user
      DB_EVALUACIONES_PASSWORD: arquisoft123
      DB_NOTIFICACIONES_URL: jdbc:postgresql://postgres:5432/notificaciones
      DB_NOTIFICACIONES_USERNAME: arquisoft_user
      DB_NOTIFICACIONES_PASSWORD: arquisoft123
      DB_SOLICITUDES_URL: jdbc:postgresql://postgres:5432/solicitudes
      DB_SOLICITUDES_USERNAME: arquisoft_user
      DB_SOLICITUDES_PASSWORD: arquisoft123
      # 'log' no intenta conectar a ningún servidor SMTP — Mailpit es opcional.
      # Para probar la entrega real: levantar el servicio 'mailpit' y poner esta var en 'smtp'.
      NOTIFICACION_PROVEEDOR: ${NOTIFICACION_PROVEEDOR:-log}
      MAIL_HOST: ${MAIL_HOST:-mailpit}
      MAIL_PORT: 1025
      MAIL_SMTP_AUTH: "false"
      MAIL_SMTP_STARTTLS: "false"
      SPRING_RABBITMQ_HOST: rabbitmq
      SPRING_REDIS_HOST: redis
      KEYCLOAK_AUTH_SERVER_URL: http://keycloak:8080
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy
      catalogo-loader:
        condition: service_completed_successfully
      keycloak:
        condition: service_healthy  # ✅ Backend espera Keycloak listo
      minio:
        condition: service_healthy
    networks:
      - arquisoft-network

volumes:
  postgres_data:
  rabbitmq_data:
  redis_data:
  minio_data:

networks:
  arquisoft-network:
    driver: bridge