services:
  # ==================== POSTGRESQL ====================
  postgres:
    image: postgres:18-alpine
    container_name: arquisoft-postgres
    environment:
      POSTGRES_DB: arquisoft
      POSTGRES_USER: arquisoft
      POSTGRES_PASSWORD: arquisoft123
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-db.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - arquisoft-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U arquisoft"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ==================== RABBITMQ ====================
  rabbitmq:
    image: rabbitmq:4.2.5-management-alpine
    container_name: arquisoft-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    ports:
      - "5672:5672"      # AMQP port
      - "15672:15672"    # Management UI
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    networks:
      - arquisoft-network
    healthcheck:
      test: rabbitmq-diagnostics -q ping
      interval: 10s
      timeout: 5s
      retries: 5

  # ==================== REDIS ====================
  redis:
    image: redis:7-alpine
    container_name: arquisoft-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - arquisoft-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ==================== KEYCLOAK ====================
  keycloak:
    image: quay.io/keycloak/keycloak:26.6
    container_name: arquisoft-keycloak
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: keycloak123
      KC_PROXY_HEADERS: xforwarded
    ports:
      - "8081:8080"
    command: start-dev
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - arquisoft-network
    healthcheck:
      test: ["CMD", "bash", "-c", "timeout 3 bash -c 'echo >/dev/tcp/localhost/8080'"]
      interval: 15s
      timeout: 10s
      retries: 5

  # ==================== NEXTCLOUD ====================
  nextcloud-db:
    image: postgres:18-alpine
    container_name: arquisoft-nextcloud-db
    environment:
      POSTGRES_DB: nextcloud
      POSTGRES_USER: nextcloud
      POSTGRES_PASSWORD: nextcloud123
    volumes:
      - nextcloud_db_data:/var/lib/postgresql/data
    networks:
      - arquisoft-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nextcloud"]
      interval: 10s
      timeout: 5s
      retries: 5

  nextcloud:
    image: nextcloud:27-apache
    container_name: arquisoft-nextcloud
    environment:
      POSTGRES_HOST: nextcloud-db
      POSTGRES_DB: nextcloud
      POSTGRES_USER: nextcloud
      POSTGRES_PASSWORD: nextcloud123
      NEXTCLOUD_ADMIN_USER: admin
      NEXTCLOUD_ADMIN_PASSWORD: admin123
    ports:
      - "8082:80"
    volumes:
      - nextcloud_data:/var/www/html
    depends_on:
      nextcloud-db:
        condition: service_healthy
    networks:
      - arquisoft-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:80/status.php"]
      interval: 15s
      timeout: 10s
      retries: 5

  # ==================== BACKEND (ARQUISOFT) ====================
  arquisoft-backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: arquisoft-backend
    environment:
      #SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/arquisoft
      SPRING_DATASOURCE_USERNAME: arquisoft
      SPRING_DATASOURCE_PASSWORD: arquisoft123
      SPRING_RABBITMQ_HOST: rabbitmq
      SPRING_REDIS_HOST: redis
      KEYCLOAK_AUTH_SERVER_URL: http://keycloak:8080
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy
      keycloak:
        condition: service_healthy
    networks:
      - arquisoft-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/api/actuator/health"]
      interval: 15s
      timeout: 10s
      retries: 5

volumes:
  postgres_data:
  rabbitmq_data:
  redis_data:
  nextcloud_db_data:
  nextcloud_data:

networks:
  arquisoft-network:
    driver: bridge