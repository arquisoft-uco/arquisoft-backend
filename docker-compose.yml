services:
  # ==================== POSTGRESQL ====================
  postgres:
    image: postgres:18-alpine
    container_name: arquisoft-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: arquisoft123
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-db.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - arquisoft-network
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres && psql -U postgres -c \"SELECT 1 FROM pg_database WHERE datname='keycloak'\" | grep -q 1" ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  # ==================== RABBITMQ ====================
  rabbitmq:
    image: rabbitmq:4.2.5-management-alpine
    container_name: arquisoft-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    networks:
      - arquisoft-network
    healthcheck:
      test: rabbitmq-diagnostics -q ping
      interval: 10s
      timeout: 5s
      retries: 5

  # ==================== REDIS ====================
  redis:
    image: redis:7-alpine
    container_name: arquisoft-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - arquisoft-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ==================== KEYCLOAK ====================
  keycloak:
    image: quay.io/keycloak/keycloak:26.6
    container_name: arquisoft-keycloak
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak
      KC_DB_USERNAME: arquisoft
      KC_DB_PASSWORD: arquisoft123
      KC_PROXY_HEADERS: xforwarded
      KC_LOG_LEVEL: INFO
    ports:
      - "8081:8080"
    command: start-dev
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - arquisoft-network
    healthcheck:
      test: [ "CMD-SHELL", "curl -sf http://localhost:8080/health/ready || exit 1" ]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 60s

  # ==================== NEXTCLOUD ====================
  # Considerar cambiarlo a Minio, mas liviano
  nextcloud-db:
    image: postgres:18-alpine
    container_name: arquisoft-nextcloud-db
    environment:
      POSTGRES_DB: nextcloud
      POSTGRES_USER: nextcloud
      POSTGRES_PASSWORD: nextcloud123
    volumes:
      - nextcloud_db_data:/var/lib/postgresql/data
    networks:
      - arquisoft-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nextcloud"]
      interval: 10s
      timeout: 5s
      retries: 5

  nextcloud:
    image: nextcloud:27-apache
    container_name: arquisoft-nextcloud
    environment:
      POSTGRES_HOST: nextcloud-db
      POSTGRES_DB: nextcloud
      POSTGRES_USER: nextcloud
      POSTGRES_PASSWORD: nextcloud123
      NEXTCLOUD_ADMIN_USER: admin
      NEXTCLOUD_ADMIN_PASSWORD: admin123
    ports:
      - "8082:80"
    volumes:
      - nextcloud_data:/var/www/html
    depends_on:
      nextcloud-db:
        condition: service_healthy
    networks:
      - arquisoft-network

  # ==================== BACKEND ====================
  arquisoft-backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: arquisoft-backend
    environment:
      DB_SEGURIDAD_URL: jdbc:postgresql://postgres:5432/usuarios
      DB_SEGURIDAD_USERNAME: arquisoft_user
      DB_SEGURIDAD_PASSWORD: arquisoft123
      DB_FICHAS_URL: jdbc:postgresql://postgres:5432/fichas_perfil
      DB_FICHAS_USERNAME: arquisoft_user
      DB_FICHAS_PASSWORD: arquisoft123
      DB_PROYECTOS_URL: jdbc:postgresql://postgres:5432/proyectos_grado
      DB_PROYECTOS_USERNAME: arquisoft_user
      DB_PROYECTOS_PASSWORD: arquisoft123
      DB_ARTEFACTOS_URL: jdbc:postgresql://postgres:5432/artefactos
      DB_ARTEFACTOS_USERNAME: arquisoft_user
      DB_ARTEFACTOS_PASSWORD: arquisoft123
      DB_REPO_ARTEFACTOS_URL: jdbc:postgresql://postgres:5432/repositorio_artefactos
      DB_REPO_ARTEFACTOS_USERNAME: arquisoft_user
      DB_REPO_ARTEFACTOS_PASSWORD: arquisoft123
      DB_ENTREGABLES_URL: jdbc:postgresql://postgres:5432/entregables
      DB_ENTREGABLES_USERNAME: arquisoft_user
      DB_ENTREGABLES_PASSWORD: arquisoft123
      DB_EVALUACIONES_URL: jdbc:postgresql://postgres:5432/evaluaciones
      DB_EVALUACIONES_USERNAME: arquisoft_user
      DB_EVALUACIONES_PASSWORD: arquisoft123
      SPRING_RABBITMQ_HOST: rabbitmq
      SPRING_REDIS_HOST: redis
      KEYCLOAK_AUTH_SERVER_URL: http://keycloak:8080
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy
      keycloak:
        condition: service_healthy  # ✅ Backend espera Keycloak listo
    networks:
      - arquisoft-network

volumes:
  postgres_data:
  rabbitmq_data:
  redis_data:
  nextcloud_db_data:
  nextcloud_data:

networks:
  arquisoft-network:
    driver: bridge