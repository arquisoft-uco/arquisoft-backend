javaVersion=21
springBootVersion=4.0.5
jUnitVersion=6.0.3
lombokVersion=1.18.36

# ==================== PLUGIN VERSIONS ====================
openapiVersion=1.9.0
springManagement=1.1.7

# ==================== DRIVER / LIBRARY VERSIONS ====================
# Solo declaramos aqui versiones que difieren del BOM de Spring Boot 4.0.5 o que el BOM no gestiona.
# Spring Boot 4.0.5 BOM ya gestiona: hibernate-validator (9.1.0.Final), jakarta.validation-api (3.1.1),
# h2 (2.4.240), flyway-core (12.4.0), jedis (gestionado), jackson-bom (3.1.2).
# Por eso esas versiones NO se declaran aqui — heredamos del BOM.
postgresVersion=42.7.2
# Bucket4j 8.x: grupo oficial Maven Central com.bucket4j. El artefacto bucket4j_jdk17-core
# requiere Java 17+ y es compatible con Java 21 y Virtual Threads (no usa synchronized internamente).
# Para futuras versiones LTS de Java (25+), solo actualizar esta versión.
bucket4jVersion=8.18.0
springdocVersion=2.8.8

# keycloakVersion removido: el proyecto usa OAuth2 Resource Server nativo de Spring Security
# + HTTP directo al token endpoint (RestTemplate). No se requiere keycloak-admin-client ni starter.

# ==================== JACKSON 2/3 COEXISTENCE ====================
# Spring Boot 4.0.5 usa Jackson 3 (tools.jackson.*) para serialización HTTP.
# Estas librerías aún dependen de Jackson 2 (com.fasterxml.jackson.*) y se gestionan
# transitoriamente hasta que publiquen versiones compatibles con Jackson 3:
#   - springdoc-openapi-starter-webmvc-ui:2.8.8 (genera /v3/api-docs)
#   - flyway-core:11.14.1 (config interna)
#   - logstash-logback-encoder:8.0 (codificador JSON para Logback — subsistema independiente del HTTP)
# Ambas Jackson coexisten sin conflicto por namespaces Java distintos.
# Revisar cuando estas librerías publiquen versiones Jackson 3.
logstashVersion=8.0