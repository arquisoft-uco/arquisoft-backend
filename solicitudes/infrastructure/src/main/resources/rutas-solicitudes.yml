# ==================== RUTAS DE CONTROLADORES — CONTEXTO SOLICITUDES ====================
# Un placeholder por segmento de path. OpenApiConfig lee la clave base via @Value
# para no duplicar el literal entre el controlador REST y la agrupacion de Swagger.
# Vive en este modulo (no en el application.yml raiz) para que, si este contexto se
# extrae a microservicio, se lleve su propia configuracion de rutas consigo.
rutas:
  solicitudes:
    solicitud:
      base: /solicitudes
      novedad-coordinador: /novedad-coordinador
      novedad-coordinador-por-id: /novedad-coordinador/{solicitudId}
      novedad-coordinador-recibidas: /novedad-coordinador/recibidas
      novedad-coordinador-enviadas: /novedad-coordinador/enviadas
      novedad-asesor: /novedad-asesor
      novedad-asesor-recibidas: /novedad-asesor/recibidas
      novedad-asesor-enviadas: /novedad-asesor/enviadas
      novedad-asesor-por-id: /novedad-asesor/{solicitudId}
      cambio-asesor: /cambio-asesor
      cambio-asesor-recibidas: /cambio-asesor/recibidas
      cambio-asesor-enviadas: /cambio-asesor/enviadas
      cambio-asesor-por-id: /cambio-asesor/{solicitudId}
      ampliacion-plazo: /ampliacion-plazo
      ampliacion-plazo-por-id: /ampliacion-plazo/{solicitudId}
      tipos-solicitud: /tipos-solicitud
    respuesta:
      base: /solicitudes
      novedad-coordinador: /novedad-coordinador/{solicitudId}/respuesta
      cambio-asesor: /cambio-asesor/{solicitudId}/respuesta
      novedad-asesor: /novedad-asesor/{solicitudId}/respuesta
      novedad-coordinador-estado: /novedad-coordinador/{solicitudId}/respuesta/estado
      novedad-asesor-estado: /novedad-asesor/{solicitudId}/respuesta/estado
      cambio-asesor-estado: /cambio-asesor/{solicitudId}/respuesta/estado
      novedad-coordinador-recibidas: /novedad-coordinador/respuestas/recibidas
      novedad-asesor-recibidas: /novedad-asesor/respuestas/recibidas
      cambio-asesor-recibidas: /cambio-asesor/respuestas/recibidas
      novedad-coordinador-enviadas: /novedad-coordinador/respuestas/enviadas
      novedad-asesor-enviadas: /novedad-asesor/respuestas/enviadas
      cambio-asesor-enviadas: /cambio-asesor/respuestas/enviadas
      estados-respuesta: /estados-respuesta
