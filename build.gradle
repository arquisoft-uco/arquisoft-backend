plugins {
    id 'java'
    id 'checkstyle'
    id 'org.springframework.boot' version "${springBootVersion}"
    id 'io.spring.dependency-management' version '1.1.7'
    id "org.springdoc.openapi-gradle-plugin" version "${openapiVersion}"
}

group = 'com.arquisoft'
version = '1.0.0'

java {
    sourceCompatibility = project.properties['javaVersion']
}

// ==================== CHECKSTYLE ====================
checkstyle {
    toolVersion = '10.12.5'
    configFile = file("${rootDir}/config/checkstyle/checkstyle.xml")
    maxWarnings = 0
    maxErrors = 0
}

configurations {
    compileOnly {
        extendsFrom annotationProcessor
    }
}

repositories {
    mavenCentral()
}

// ==================== APLICACIÓN PRINCIPAL ====================
dependencies {
    implementation "org.springframework.boot:spring-boot-starter-web:${springBootVersion}"
    implementation "org.springframework.boot:spring-boot-starter-amqp:${springBootVersion}"
    implementation "org.springframework.boot:spring-boot-starter-actuator:${springBootVersion}"

    // OpenAPI / Swagger UI (ADR-011) — va aquí porque describe la API ensamblada completa
    implementation "org.springdoc:springdoc-openapi-starter-webmvc-ui:${springdocVersion}"
    
    // Incluir todos los módulos de infraestructura (contextos)
    subprojects.each { subproject ->
        if (subproject.name.endsWith('infrastructure')) {
            implementation project(subproject.path)
        }
    }

    testImplementation "org.springframework.boot:spring-boot-starter-test:${springBootVersion}"
    testImplementation "org.junit.jupiter:junit-jupiter:${jUnitVersion}"
}

test {
    useJUnitPlatform()
}

bootJar {
    mainClass = 'com.arquisoft.ArquisoftApplication'
    archiveFileName = "arquisoft-${version}.jar"
    version = version
}

// ==================== CONFIGURACIÓN SUBPROYECTOS ====================
subprojects { subproject ->
    apply plugin: 'java'
    apply plugin: 'checkstyle'

    checkstyle {
        toolVersion = '10.12.5'
        configFile = rootProject.file("config/checkstyle/checkstyle.xml")
        maxWarnings = 0
        maxErrors = 0
    }

    if (subproject.name.endsWith('application') || subproject.name.endsWith('infrastructure')) {
        dependencies {
            implementation "org.springframework.boot:spring-boot-starter-web:${springBootVersion}"

            compileOnly "org.projectlombok:lombok:${lombokVersion}"

            annotationProcessor "org.projectlombok:lombok:${lombokVersion}"

            testImplementation "org.springframework.boot:spring-boot-starter-test:${springBootVersion}"
        }
    }

    // Unique GAV per context: e.g. com.arquisoft.seguridad:domain avoids collision with com.arquisoft.shared:domain
    if (subproject.parent != rootProject) {
        group = "${rootProject.group}.${subproject.parent.name}"
        // Unique JAR name: e.g. seguridad-infrastructure-1.0.0.jar to avoid bootJar collision
        base {
            archivesName = "${subproject.parent.name}-${subproject.name}"
        }
    } else {
        group = rootProject.group
    }
    version = parent.version

    java {
        sourceCompatibility = project.properties['javaVersion']
    }

    repositories {
        mavenCentral()
    }

    dependencies {
        testImplementation platform("org.junit:junit-bom:${jUnitVersion}")
        testImplementation "org.junit.jupiter:junit-jupiter:${jUnitVersion}"
    }

    test {
        useJUnitPlatform()
    }

    configurations {
        compileOnly {
            extendsFrom annotationProcessor
        }
    }

    compileJava {
        options.compilerArgs.add('-parameters')
    }
}