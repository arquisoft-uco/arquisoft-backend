dependencies {
    implementation project(':notificaciones:domain')
    implementation project(':shared:domain')
    implementation project(':shared:logger')

    // shared:notification — puerto NotificationSender. La aplicacion conoce el puerto y su
    // value object, nunca un proveedor concreto: cambiar de SMTP a otro transporte no llega aqui.
    implementation project(':shared:notification')

    // Entity JPA: las entidades viven en secondaryport/entity, asi que este modulo necesita las
    // anotaciones @Entity/@Column — solo la API, no el starter de datos completo.
    implementation "jakarta.persistence:jakarta.persistence-api"

    // Transactional — solo necesitamos @Transactional, no todo el starter
    implementation 'org.springframework:spring-tx'

    // Testing — junit-platform-launcher requerido explicitamente por Gradle 9
    testImplementation "org.assertj:assertj-core"
    testImplementation "org.mockito:mockito-core"
    testImplementation "org.mockito:mockito-junit-jupiter"
    testRuntimeOnly "org.junit.platform:junit-platform-launcher"
    testRuntimeOnly "org.junit.jupiter:junit-jupiter-engine"
}
