plugins {
    id 'java-test-fixtures'
}

dependencies {
    implementation project(':shared:domain')
    implementation project(':shared:logger')

    // shared:tracing — TrazabilidadFilter abre el alcance de traza y
    // GlobalAppExceptionHandler lee la correlacion para el ErrorResponseDTO.
    implementation project(':shared:tracing')

    // shared:query — PageResponseDTO envuelve un PaginatedResult, y los controladores
    // reciben QueryCriteriaRequestDTO desde este módulo.
    implementation project(':shared:query')

    // Spring Web
    implementation "org.springframework.boot:spring-boot-starter-web"

    // Spring Data Commons — requerido por PageResponseDTO.from(Page<T>)
    implementation 'org.springframework.data:spring-data-commons'

    // REST Client (WebFlux para WebClient)
    implementation "org.springframework.boot:spring-boot-starter-webflux"

    // JSON processing — Jackson 3.x viene transitivo de spring-boot-starter-web → spring-boot-starter-jackson

    // Validation
    implementation "org.springframework.boot:spring-boot-starter-validation"

    // Spring Security Core (AuthorizationDeniedException, AccessDeniedException)
    implementation "org.springframework.security:spring-security-core"

    // Fixtures de test: resolver de IdentidadActual para los @WebMvcTest de los contextos
    testFixturesImplementation "org.springframework.security:spring-security-core"
    testFixturesImplementation "org.springframework.security:spring-security-oauth2-jose"
    testFixturesImplementation "org.springframework:spring-webmvc"
    testFixturesImplementation "org.springframework.boot:spring-boot-starter-test"

    // Lombok
    compileOnly "org.projectlombok:lombok:${lombokVersion}"
    annotationProcessor "org.projectlombok:lombok:${lombokVersion}"

    // Testing
    testImplementation "org.springframework.boot:spring-boot-starter-test"
    testRuntimeOnly "org.junit.platform:junit-platform-launcher"
}