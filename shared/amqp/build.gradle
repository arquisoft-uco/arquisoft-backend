dependencies {
    implementation project(':shared:domain')
    implementation project(':shared:logger')

    // Spring AMQP (RabbitMQ)
    implementation "org.springframework.boot:spring-boot-starter-amqp"

    // Jackson 3.x — gestionado por Spring Boot 4.x BOM (tools.jackson.core:jackson-databind:3.1.0)
    implementation "org.springframework.boot:spring-boot-starter-jackson"

    // spring-retry está disponible transitivamente via spring-boot-starter-amqp (spring-rabbit → spring-retry).
    // Se usa RetryTemplate directamente — sin @Retryable ni AOP para evitar dependencias innecesarias.

    compileOnly "org.projectlombok:lombok:${lombokVersion}"
    annotationProcessor "org.projectlombok:lombok:${lombokVersion}"
}