# =============================================================================
# Catálogo de mensajes — contexto seguridad
# Esquema de clave: contexto.capa.objeto.tipo.descripcion   (ver messages/app.properties)
#
# Los textos que antes eran prefijos concatenados (ERROR_COMUNICACION_KEYCLOAK,
# LIMITE_EXCEDIDO_PREFIJO, ...) pasan a ser patrones con %s. Un properties no
# conserva de forma fiable el espacio final de un valor, y un patrón completo
# documenta mejor el mensaje resultante que dos mitades concatenadas.
# =============================================================================

