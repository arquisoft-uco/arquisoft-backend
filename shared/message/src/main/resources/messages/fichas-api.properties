# =============================================================================
# Catálogo de mensajes — contexto fichas, documentación OpenAPI/Swagger
# Esquema de clave: contexto.capa.objeto.tipo.descripcion   (tipo = api)
#
# Estas claves se consumen desde anotaciones (@Operation, @ApiResponse), que el
# compilador obliga a alimentar con constantes. Por eso este archivo se carga
# DOS veces:
#   1. como ResourceBundle, igual que el resto del catálogo — permite testearlo; y
#   2. como PropertySource de Spring (ver ApiDocsMessagesConfig), para que springdoc
#      resuelva ${clave} en las anotaciones.
# La fuente de verdad sigue siendo un único archivo.
#
# @Tag queda fuera: springdoc NO resuelve ${...} en esa anotación, así que su texto
# vive incrustado en FichasApiKeys.TAG_NAME / TAG_DESCRIPTION.
# =============================================================================

