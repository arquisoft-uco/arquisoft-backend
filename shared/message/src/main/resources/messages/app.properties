# =============================================================================
# Catálogo de mensajes — transversales
#
# Esquema de clave:  contexto.capa.objeto.tipo.descripcion
#   contexto     app | fichas | seguridad | usuarios
#   capa         dominio | aplicacion | infraestructura
#   objeto       agregado, filtro o componente al que pertenece el texto
#   tipo         error | log | validacion | api
#   descripcion  kebab-case
#
# Los parámetros usan la sintaxis de java.util.Formatter (%s, %d), NO la de
# MessageFormat: los textos llevan comillas simples que MessageFormat trataría
# como carácter de escape.
#
# Los patrones de log conservan los marcadores {} de SLF4J y se recuperan con
# obtener(), sin formatear — es el logger quien sustituye los argumentos.
# =============================================================================

