# =============================================================================
# Mensajes de las restricciones Jakarta Bean Validation.
#
# Este archivo NO lo lee MessageCatalog: lo resuelve Hibernate Validator, que es
# quien interpreta la sintaxis message="{clave}" de las anotaciones. Es el único
# camino para externalizar un texto que vive dentro de una anotación, porque el
# compilador exige que el valor de un atributo de anotación sea una constante.
#
# El nombre y la ubicación son fijos: base name "ValidationMessages" en la raíz
# del classpath (Jakarta Validation 3.1, §5.3.1).
#
# Los parámetros usan la interpolación propia de Bean Validation ({max}, {min}),
# que toma el valor del propio atributo de la restricción. Así el número del
# mensaje no se puede desincronizar del @Size que lo produce.
#
# Esquema de clave: contexto.capa.objeto.validacion.descripcion
# =============================================================================

# ---------------------------------------------------------------------------
# Transversales
# ---------------------------------------------------------------------------
