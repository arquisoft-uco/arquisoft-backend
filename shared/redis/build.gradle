dependencies {
    implementation project(':shared:domain')

    // Spring Data Redis — Lettuce es el cliente por defecto cuando Jedis no esta en classpath
    implementation "org.springframework.boot:spring-boot-starter-data-redis"

    // Pool de conexiones para Lettuce
    implementation "org.apache.commons:commons-pool2"

    // Jackson 3.x databind — spring-data-redis declara Jackson como 'optional', por lo que
    // no viene transitivo. Necesario para GenericJacksonJsonRedisSerializer.
    implementation "tools.jackson.core:jackson-databind"

    compileOnly "org.projectlombok:lombok:${lombokVersion}"
    annotationProcessor "org.projectlombok:lombok:${lombokVersion}"
}