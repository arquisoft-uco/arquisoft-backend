dependencies {
    implementation project(':shared:domain')

    // shared:message — el catálogo. Llega transitivo por shared:domain (api), pero este módulo
    // ahora implementa su puerto: dejar la dependencia implícita ocultaría la relación real.
    implementation project(':shared:message')

    // shared:logger — AppLogger, el puerto de logging que usan el adaptador y el monitor.
    implementation project(':shared:logger')

    // shared:tracing — GestorTraza, para que MonitorCatalogoRedis abra su propio alcance de
    // traza antes de loguear: es un @Scheduled, no hereda ningun contexto de peticion/evento.
    implementation project(':shared:tracing')

    // Actuator — CatalogoMensajesHealthIndicator publica el estado degradado en /actuator/health.
    implementation "org.springframework.boot:spring-boot-starter-actuator"

    // Spring Data Redis — Lettuce es el cliente por defecto cuando Jedis no esta en classpath
    implementation "org.springframework.boot:spring-boot-starter-data-redis"

    // Pool de conexiones para Lettuce
    implementation "org.apache.commons:commons-pool2"

    // Jackson 3.x databind — spring-data-redis declara Jackson como 'optional', por lo que
    // no viene transitivo. Necesario para GenericJacksonJsonRedisSerializer.
    implementation "tools.jackson.core:jackson-databind"

    // Starter de MessageUcoLab — MessageReader, con el que se sincroniza el catálogo (ADR-017).
    implementation "co.edu.uco:messageucolab-spring-boot-starter:${messageUcoLabVersion}"

    // Starter de Seguridad — solo su ServiceAccessTokenProvider: pide a Keycloak el token de la
    // identidad de servicio que el starter de MessageUcoLab envía en cada consulta. Su filtro y su
    // registro de PEP se apagan en application.yml; la autorización sigue en el adaptador propio.
    // Llega sin transitivas (ver el repositorio 'Seguridad' en el build.gradle raíz): no trae su
    // starter de WebFlux, que arquisoft —servlet— no necesita.
    implementation "co.edu.uco:security-pep-integration-spring-boot-starter:${securityPepIntegrationVersion}"

    // Cliente de Pulsar — escucha los avisos de cambio de MessageUcoLab para actualizar una clave
    // del catálogo apenas cambia. Cliente plano y no spring-boot-starter-pulsar: así no se activa
    // ninguna autoconfiguración y solo existe con la fuente messageuco. Versión por bomProperty.
    implementation "org.apache.pulsar:pulsar-client"

    compileOnly "org.projectlombok:lombok:${lombokVersion}"
    annotationProcessor "org.projectlombok:lombok:${lombokVersion}"

    testImplementation "org.assertj:assertj-core"
    testImplementation "org.mockito:mockito-core"
    testImplementation "org.mockito:mockito-junit-jupiter"
}
