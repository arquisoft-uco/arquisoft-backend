dependencies {
    implementation project(':shared:domain')

    // shared:message — el catálogo. Llega transitivo por shared:domain (api), pero este módulo
    // ahora implementa su puerto: dejar la dependencia implícita ocultaría la relación real.
    implementation project(':shared:message')

    // shared:logger — AppLogger, el puerto de logging que usan el adaptador y el monitor.
    implementation project(':shared:logger')

    // Actuator — CatalogoMensajesHealthIndicator publica el estado degradado en /actuator/health.
    implementation "org.springframework.boot:spring-boot-starter-actuator"

    // Spring Data Redis — Lettuce es el cliente por defecto cuando Jedis no esta en classpath
    implementation "org.springframework.boot:spring-boot-starter-data-redis"

    // Pool de conexiones para Lettuce
    implementation "org.apache.commons:commons-pool2"

    // Jackson 3.x databind — spring-data-redis declara Jackson como 'optional', por lo que
    // no viene transitivo. Necesario para GenericJacksonJsonRedisSerializer.
    implementation "tools.jackson.core:jackson-databind"

    compileOnly "org.projectlombok:lombok:${lombokVersion}"
    annotationProcessor "org.projectlombok:lombok:${lombokVersion}"

    testImplementation "org.assertj:assertj-core"
    testImplementation "org.mockito:mockito-core"
    testImplementation "org.mockito:mockito-junit-jupiter"
}
