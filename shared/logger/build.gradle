dependencies {
    // SLF4J + Logback — transitivos de spring-boot-starter-logging.
    // Se declara explícitamente para garantizar que logback-spring.xml sea reconocido
    // como configuración de Spring Boot en cualquier contexto que importe este módulo.
    implementation "org.springframework.boot:spring-boot-starter-logging"

    // JSON encoder para Logback (perfil prod → Loki vía stdout / Alloy).
    // Usa Jackson 2 (com.fasterxml.jackson.*) de forma independiente al HTTP stack
    // de Spring Boot 4.x que usa Jackson 3 (tools.jackson.*). Coexistencia documentada
    // en gradle.properties § JACKSON 2/3 COEXISTENCE.
    implementation "net.logstash.logback:logstash-logback-encoder:${logstashVersion}"

    // Micrometer Tracing — inyecta traceId + spanId en MDC automáticamente.
    // Spring Boot 4.x BOM gestiona la versión de micrometer-tracing-bridge-brave.
    // Sin configurar un exporter, Brave opera en modo no-op (genera IDs sin enviarlos),
    // lo cual es correcto para dev. En prod, añadir un exporter OTel/Zipkin si se usa Tempo.
    implementation "io.micrometer:micrometer-tracing-bridge-brave"
}
