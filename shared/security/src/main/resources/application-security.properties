#################### CONFIGURACIÓN DE KEYCLOAK ####################
# URL del servidor Keycloak
keycloak.auth-server-url=${KEYCLOAK_URL:https://localhost:8443/auth}

# Realm del Keycloak
keycloak.realm=${KEYCLOAK_REALM:emboliados}

# Cliente del Keycloak
keycloak.resource=${KEYCLOAK_CLIENT_ID:emboliados-app}

# Credenciales del cliente
keycloak.credentials.secret=${KEYCLOAK_CLIENT_SECRET:}

# Configuración principal del cliente
keycloak.use-resource-role-mappings=false
keycloak.bearer-only=true
keycloak.public-client=false

#################### CONFIGURACIÓN DE SEGURIDAD ####################
# JWT - Configuración de expiración
security.jwt.access-token-expiration=${JWT_ACCESS_TOKEN_EXPIRATION:3600000}
security.jwt.refresh-token-expiration=${JWT_REFRESH_TOKEN_EXPIRATION:604800000}

#################### CONFIGURACIÓN DE CORS ####################
# CORS - Orígenes permitidos (separados por comas)
security.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:4200,http://localhost:8080}

# CORS - Métodos permitidos
security.cors.allowed-methods=${CORS_ALLOWED_METHODS:GET,POST,PUT,DELETE,OPTIONS,PATCH}

# CORS - Headers permitidos
security.cors.allowed-headers=${CORS_ALLOWED_HEADERS:*}

# CORS - Tiempo máximo de caché (en segundos)
security.cors.max-age=${CORS_MAX_AGE:3600}

# CORS - Permitir credenciales (cookies, headers de autorización)
security.cors.allow-credentials=${CORS_ALLOW_CREDENTIALS:true}

#################### CONFIGURACIÓN DE RATE LIMITING ####################
# Rate Limiting - Habilitar/Deshabilitar
security.rate-limit.enabled=${RATE_LIMIT_ENABLED:true}

# Rate Limiting - Solicitudes por minuto (endpoint general)
security.rate-limit.requests-per-minute=${RATE_LIMIT_REQUESTS_PER_MINUTE:100}

# Rate Limiting - Solicitudes por minuto (endpoint de login)
security.rate-limit.login-requests-per-minute=${RATE_LIMIT_LOGIN_REQUESTS_PER_MINUTE:5}

#################### CONFIGURACIÓN DE SESIÓN ####################
# Política de creación de sesiones (stateless)
server.servlet.session.tracking-modes=COOKIE
spring.session.store-type=none

#################### CONFIGURACIÓN DE LOGS ####################
# Logs de seguridad
logging.level.com.arquisoft.shared.security=INFO
logging.level.org.springframework.security=WARN
logging.level.org.springframework.oauth2=WARN

# Logs de auditoría
logging.level.com.arquisoft.shared.security.infrastructure.filters.AuditFilter=INFO

#################### CONFIGURACIÓN DE HTTP CLIENT ####################
# Timeout de conexión (ms)
http.client.connect-timeout=${HTTP_CLIENT_CONNECT_TIMEOUT:5000}

# Timeout de lectura (ms)
http.client.read-timeout=${HTTP_CLIENT_READ_TIMEOUT:30000}
