# ==================== RUTAS DE CONTROLADORES — CONTEXTO EVALUACIONES ====================
# Un placeholder por segmento de path. OpenApiConfig lee la misma clave via @Value
# para no duplicar el literal entre el controlador REST y la agrupacion de Swagger.
# Vive en este modulo (no en el application.yml raiz) para que, si este contexto se
# extrae a microservicio, se lleve su propia configuracion de rutas consigo.
rutas:
  evaluaciones:
    items-cualitativos-jurado:
      base: /evaluaciones/items-cualitativos-jurado
      por-id: /{itemId}
    criterios-item-cualitativo-jurado:
      base: /evaluaciones/criterios-item-cualitativo-jurado
    categorias-item-cuantitativo-jurado:
      base: /evaluaciones/categorias-item-cuantitativo-jurado
    evaluaciones-jurado:
      base: /evaluaciones/evaluaciones-jurado
      cualitativas: /{evaluacionJuradoId}/cualitativas
      cuantitativas: /{evaluacionJuradoId}/cuantitativas
    items-cuantitativos-jurado:
      base: /evaluaciones/items-cuantitativos-jurado
      por-id: /{itemId}
    evaluaciones-cuantitativas-jurado:
      base: /evaluaciones/evaluaciones-cuantitativas-jurado
      puntaje: /{id}/puntaje
      observaciones: /{id}/observaciones
      observaciones-jurado: /{id}/observaciones/jurado
    observaciones-item-jurado:
      base: /evaluaciones/observaciones-item-jurado
      por-id: /{observacionId}
    estados-evaluacion:
      base: /evaluaciones/estados-evaluacion
    evaluacion:
      base: /evaluaciones
      evaluaciones-jurado: /{evaluacionId}/evaluaciones-jurado
      coordinador: /coordinador
