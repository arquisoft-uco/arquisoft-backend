# ==================== RUTAS DE CONTROLADORES — CONTEXTO EVALUACIONES ====================
# Un placeholder por segmento de path. OpenApiConfig lee la misma clave via @Value
# para no duplicar el literal entre el controlador REST y la agrupacion de Swagger.
# Vive en este modulo (no en el application.yml raiz) para que, si este contexto se
# extrae a microservicio, se lleve su propia configuracion de rutas consigo.
rutas:
  evaluaciones:
    evaluacion:
      base: /evaluaciones
      jurados: /{evaluacionId}/jurados
      evaluacion-asesor: /{evaluacionId}/evaluacion-asesor
      evaluacion-asesor-por-id: /evaluaciones-asesor/{evaluacionAsesorId}
      evaluaciones-jurado: /{evaluacionId}/evaluaciones-jurado
      coordinador: /coordinador
      asesor: /asesor
      jurado: /jurado
      estudiante: /estudiante
    items-cualitativos-jurado:
      base: /evaluaciones/items-cualitativos-jurado
      por-id: /{itemId}
    criterios-item-cualitativo-jurado:
      base: /evaluaciones/criterios-item-cualitativo-jurado
    categorias-item-cuantitativo-jurado:
      base: /evaluaciones/categorias-item-cuantitativo-jurado
    categorias-item-cuantitativo-asesor:
      base: /evaluaciones/categorias-item-cuantitativo-asesor
    evaluaciones-jurado:
      base: /evaluaciones/evaluaciones-jurado
      cualitativas: /{evaluacionJuradoId}/cualitativas
      cualitativas-jurado: /{evaluacionJuradoId}/cualitativas/jurado
      cuantitativas: /{evaluacionJuradoId}/cuantitativas
      cuantitativas-jurado: /{evaluacionJuradoId}/cuantitativas/jurado
      jurado: /jurado
    evaluaciones:
      base: /evaluaciones/evaluaciones-asesor
      cuantitativas: /{evaluacionAsesorId}/cuantitativas
      cuantitativas-estudiante: /{evaluacionAsesorId}/cuantitativas/estudiante
      cualitativas: /{evaluacionAsesorId}/cualitativas
      cualitativas-estudiante: /{evaluacionAsesorId}/cualitativas/estudiante
    criterios-item-cualitativo-asesor:
      base: /evaluaciones/criterios-item-cualitativo-asesor
    items-cualitativos-asesor:
      base: /evaluaciones/items-cualitativos-asesor
      por-id: /{itemId}
    items-cuantitativos-asesor:
      base: /evaluaciones/items-cuantitativos-asesor
      por-id: /{itemId}
    items-cuantitativos-jurado:
      base: /evaluaciones/items-cuantitativos-jurado
      por-id: /{itemId}
    evaluaciones-cualitativas-jurado:
      base: /evaluaciones/evaluaciones-cualitativas-jurado
      criterio: /{id}/criterio
    evaluaciones-cuantitativas-jurado:
      base: /evaluaciones/evaluaciones-cuantitativas-jurado
      puntaje: /{id}/puntaje
      observaciones: /{id}/observaciones
      observaciones-jurado: /{id}/observaciones/jurado
      observaciones-estudiante: /{id}/observaciones/estudiante
    evaluaciones-cuantitativas-asesor:
      base: /evaluaciones/evaluaciones-cuantitativas-asesor
      observaciones: /{evaluacionCuantitativaAsesorId}/observaciones
      observaciones-asesor: /{evaluacionCuantitativaAsesorId}/observaciones/asesor
      observaciones-estudiante: /{evaluacionCuantitativaAsesorId}/observaciones/estudiante
    evaluaciones-cualitativas-asesor:
      base: /evaluaciones/evaluaciones-cualitativas-asesor
      criterio: /{evaluacionCualitativaAsesorId}/criterio
    observaciones-item-asesor:
      base: /evaluaciones/observaciones-item-asesor
      por-id: /{observacionId}
    observaciones-item-jurado:
      base: /evaluaciones/observaciones-item-jurado
      por-id: /{observacionId}
    estados-evaluacion:
      base: /evaluaciones/estados-evaluacion
