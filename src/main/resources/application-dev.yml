# ==================== PERFIL DESARROLLO (DEV) ====================
# Activa: ./gradlew bootRun --args='--spring.profiles.active=dev'
#
# Sobreescribe application.yml con configuracion especifica para desarrollo local.

spring:
  jpa:
    show-sql: true

# ==================== NOTIFICACIONES (DEV) ====================
# Por defecto en dev NO se entrega nada: la estrategia 'log' solo registra el envío.
# Para probar la entrega real contra Mailpit (docker-compose up mailpit):
#   NOTIFICACION_PROVEEDOR=smtp  →  bandeja en http://localhost:8025
notificacion:
  proveedor: ${NOTIFICACION_PROVEEDOR:log}

# ==================== CORS (DEV) ====================
security:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:4200,http://localhost:5173,http://localhost:8080}
  rate-limit:
    enabled: ${RATE_LIMIT_ENABLED:false}
    requests-per-minute: ${RATE_LIMIT_REQUESTS_PER_MINUTE:100}
    login-requests-per-minute: ${RATE_LIMIT_LOGIN_REQUESTS_PER_MINUTE:5}
    max-tracked-ips: ${RATE_LIMIT_MAX_TRACKED_IPS:10000}

# ==================== LOGGING ====================
# logback-spring.xml controla appenders y formato (texto ANSI en dev).
# Aqui solo se ajustan niveles por paquete sobre el root INFO definido en el XML.
# Los grupos se declaran una sola vez en application.yml. Aqui solo van los niveles por
# defecto del perfil; cualquiera se sobreescribe desde .env sin tocar este archivo.
logging:
  level:
    root: ${LOG_NIVEL_ROOT:INFO}
    negocio: ${LOG_NIVEL_NEGOCIO:DEBUG}
    plataforma: ${LOG_NIVEL_PLATAFORMA:DEBUG}
    # SQL de Hibernate + parametros ligados
    datos: ${LOG_NIVEL_DATOS:DEBUG}
    seguridad: ${LOG_NIVEL_SEGURIDAD:DEBUG}
    # Incluye Spring Modulith: ciclo de vida de eventos (registro, publicación, completado, retry)
    mensajeria: ${LOG_NIVEL_MENSAJERIA:DEBUG}
    framework: ${LOG_NIVEL_FRAMEWORK:INFO}
