# ==================== PERFIL DESARROLLO (DEV) ====================
# Activa: ./gradlew bootRun --args='--spring.profiles.active=dev'
#
# Sobreescribe application.yml con configuracion especifica para desarrollo local.

spring:
  jpa:
    show-sql: true

# ==================== CORS (DEV) ====================
security:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS}

# ==================== LOGGING ====================
logging:
  level:
    com.arquisoft: DEBUG
    org.springframework.security: DEBUG
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE
