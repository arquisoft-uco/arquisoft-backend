# ==================== PERFIL DESARROLLO (DEV) ====================
# Activa: ./gradlew bootRun --args='--spring.profiles.active=dev'
#
# Solo contiene overrides sobre application.yml.
# Diferencias respecto al perfil base:
#   - show-sql: true       (ver queries en consola)
#   - rate-limit: false    (ya es el default, explícito por claridad)
#   - Spring Security en DEBUG (ver decisiones de autorizacion)

spring:
  jpa:
    show-sql: true

# ==================== LOGGING ====================
logging:
  level:
    org.springframework.security: DEBUG
