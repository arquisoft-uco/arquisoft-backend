# ==================== PERFIL DESARROLLO (DEV) ====================
# Activa: ./gradlew bootRun --args='--spring.profiles.active=dev'
#
# Sobreescribe application.yml con configuracion especifica para desarrollo local.

spring:
  jpa:
    show-sql: true

# ==================== CORS (DEV) ====================
security:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:4200,http://localhost:5173,http://localhost:8080}
  rate-limit:
    enabled: ${RATE_LIMIT_ENABLED:false}
    requests-per-minute: ${RATE_LIMIT_REQUESTS_PER_MINUTE:100}
    login-requests-per-minute: ${RATE_LIMIT_LOGIN_REQUESTS_PER_MINUTE:5}
    # RATE_LIMIT_MAX_TRACKED_IPS eliminado — propiedad removida al migrar a RedisBucketResolver

# ==================== LOGGING ====================
# logback-spring.xml controla appenders y formato (texto ANSI en dev).
# Aqui solo se ajustan niveles por paquete sobre el root INFO definido en el XML.
logging:
  level:
    com.arquisoft: DEBUG
    org.springframework.security: DEBUG
    org.hibernate.SQL: DEBUG
    # Spring Modulith: ciclo de vida de eventos (registro, publicación, completado, retry)
    org.springframework.modulith: DEBUG
