# ==================== PERFIL PRODUCCIÓN (PROD) ====================
# Activa: application.yml + application-prod.yml

spring:
  # ==================== BASE DE DATOS ====================
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://postgres:5432/arquisoft}
    username: ${DATABASE_USER:arquisoft}
    password: ${DATABASE_PASSWORD:arquisoft123}
    hikari:
      maximum-pool-size: 30
      minimum-idle: 10
      connection-timeout: 30000

  # ==================== JPA/HIBERNATE ====================
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: false

  # ==================== FLYWAY ====================
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false

  # ==================== RABBITMQ ====================
  rabbitmq:
    host: ${RABBITMQ_HOST:rabbitmq}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER:arquisoft}
    password: ${RABBITMQ_PASSWORD:arquisoft123}
    listener:
      simple:
        concurrency: 10
        max-concurrency: 20

  # ==================== REDIS ====================
  redis:
    host: ${REDIS_HOST:redis}
    port: ${REDIS_PORT:6379}
    timeout: 3000
    jedis:
      pool:
        max-active: 20
        max-idle: 10
        min-idle: 5

# ==================== KEYCLOAK ====================
keycloak:
  auth-server-url: ${KEYCLOAK_URL:http://keycloak:8080}
  realm: ${KEYCLOAK_REALM:arquisoft}
  resource: ${KEYCLOAK_CLIENT_ID:arquisoft-app}
  credentials:
    secret: ${KEYCLOAK_CLIENT_SECRET:}

# ==================== SEGURIDAD ====================
security:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:https://arquisoft.uco.edu.co}
  rate-limit:
    enabled: true
    requests-per-minute: 60
    login-requests-per-minute: 3

# ==================== LOGGING ====================
logging:
  level:
    root: WARN
    com.arquisoft: INFO
    org.springframework.web: WARN
    org.hibernate.SQL: WARN
    org.springframework.security: WARN
  file:
    name: /var/log/arquisoft/arquisoft.log
    max-size: 50MB
    max-history: 30

# ==================== ACTUATOR ====================
management:
  endpoints:
    web:
      exposure:
        include: health,metrics,prometheus
  endpoint:
    health:
      show-details: when-authorized

# ==================== SPRINGDOCS ====================
springdoc:
  swagger-ui:
    enabled: false
  api-docs:
    enabled: false