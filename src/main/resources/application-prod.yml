# ==============================================================================
# PERFIL PRODUCCIÓN (PROD)
# ==============================================================================
# Activa: application.yml + application-prod.yml
# Activar con: --spring.profiles.active=prod
#
# NOTAS DE ARQUITECTURA:
# - Sin spring.datasource global: cada bounded context tiene su propio DataSource.
# - Sin spring.jpa global: cada *DataSourceConfig.java configura su EntityManagerFactory.
# - Sin spring.flyway global: cada *DataSourceConfig.java configura su instancia Flyway.
# - Sin defaults en datasources ni en Keycloak: todas las variables son obligatorias en producción.
# ==============================================================================

spring:
  # ==================== RABBITMQ ====================
  rabbitmq:
    host: ${RABBITMQ_HOST}
    port: ${RABBITMQ_PORT}
    username: ${RABBITMQ_USERNAME}
    password: ${RABBITMQ_PASSWORD}
    listener:
      simple:
        concurrency: 10
        max-concurrency: 20

  # ==================== REDIS ====================
  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT}
      timeout: 3000ms
      jedis:
        pool:
          max-active: 20
          max-idle: 10
          min-idle: 5

  # ==================== OAUTH2 / KEYCLOAK (Spring Boot 3.x+) ====================
  # Resource Server: valida tokens JWT entrantes.
  # Client: permite al backend llamar al endpoint /token de Keycloak.
  # En producción todas las variables son obligatorias — sin defaults.
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${KEYCLOAK_URL}/realms/${KEYCLOAK_REALM}
          jwk-set-uri: ${KEYCLOAK_URL}/realms/${KEYCLOAK_REALM}/protocol/openid-connect/certs
      client:
        provider:
          keycloak:
            issuer-uri: ${KEYCLOAK_URL}/realms/${KEYCLOAK_REALM}
            token-uri: ${KEYCLOAK_URL}/realms/${KEYCLOAK_REALM}/protocol/openid-connect/token
            jwk-set-uri: ${KEYCLOAK_URL}/realms/${KEYCLOAK_REALM}/protocol/openid-connect/certs
        registration:
          keycloak:
            provider: keycloak
            client-id: ${KEYCLOAK_CLIENT_ID}
            client-secret: ${KEYCLOAK_CLIENT_SECRET}
            authorization-grant-type: password
            scope: openid, profile, email

# ==================== DATASOURCES POR BOUNDED CONTEXT (PROD) ====================
datasource:
  seguridad:
    url: ${DB_SEGURIDAD_URL}
    username: ${DB_SEGURIDAD_USERNAME}
    password: ${DB_SEGURIDAD_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 30000
      pool-name: HikariPool-Seguridad-Prod

  fichas:
    url: ${DB_FICHAS_URL}
    username: ${DB_FICHAS_USERNAME}
    password: ${DB_FICHAS_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 30000
      pool-name: HikariPool-Fichas-Prod

  proyectos:
    url: ${DB_PROYECTOS_URL}
    username: ${DB_PROYECTOS_USERNAME}
    password: ${DB_PROYECTOS_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 30000
      pool-name: HikariPool-Proyectos-Prod

  artefactos:
    url: ${DB_ARTEFACTOS_URL}
    username: ${DB_ARTEFACTOS_USERNAME}
    password: ${DB_ARTEFACTOS_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 30000
      pool-name: HikariPool-Artefactos-Prod

  repositorio_artefactos:
    url: ${DB_REPO_ARTEFACTOS_URL}
    username: ${DB_REPO_ARTEFACTOS_USERNAME}
    password: ${DB_REPO_ARTEFACTOS_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 30000
      pool-name: HikariPool-RepositorioArtefactos-Prod

  entregables:
    url: ${DB_ENTREGABLES_URL}
    username: ${DB_ENTREGABLES_USERNAME}
    password: ${DB_ENTREGABLES_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 30000
      pool-name: HikariPool-Entregables-Prod

  evaluaciones:
    url: ${DB_EVALUACIONES_URL}
    username: ${DB_EVALUACIONES_USERNAME}
    password: ${DB_EVALUACIONES_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 30000
      pool-name: HikariPool-Evaluaciones-Prod

# ==================== KEYCLOAK (propiedades propias) ====================
# Leídas por KeycloakAuthAdapter y SecurityConfig via @Value("${arquisoft.keycloak.*}").
# Sin defaults — obligatorias en producción.
arquisoft:
  keycloak:
    server-url: ${KEYCLOAK_URL}
    realm: ${KEYCLOAK_REALM}
    client-id: ${KEYCLOAK_CLIENT_ID}
    client-secret: ${KEYCLOAK_CLIENT_SECRET}

# ==================== CORS Y RATE LIMITING (PROD) ====================
# Leídas por CorsConfig y RateLimitConfig via @Value("${security.cors.*}") y @Value("${security.rate-limit.*}")
security:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS}
  rate-limit:
    enabled: ${RATE_LIMIT_ENABLED:true}
    requests-per-minute: ${RATE_LIMIT_REQUESTS_PER_MINUTE:60}
    login-requests-per-minute: ${RATE_LIMIT_LOGIN_REQUESTS_PER_MINUTE:3}
    max-tracked-ips: ${RATE_LIMIT_MAX_TRACKED_IPS:1000}

# ==================== LOGGING ====================
logging:
  level:
    root: WARN
    com.arquisoft: INFO
    org.springframework.web: WARN
    org.hibernate.SQL: WARN
    org.springframework.security: WARN
  file:
    name: /var/log/arquisoft/arquisoft.log
  logback:
    rollingpolicy:
      max-file-size: 50MB
      max-history: 30

# ==================== ACTUATOR ====================
management:
  endpoints:
    web:
      exposure:
        include: health,metrics,prometheus
  endpoint:
    health:
      show-details: when-authorized

# ==================== SPRINGDOCS ====================
springdoc:
  swagger-ui:
    enabled: false
  api-docs:
    enabled: false