# ==============================================================================
# CONFIGURACION BASE DE ARQUISOFT
# ==============================================================================
# Importa credenciales desde .env o .env.properties (archivos locales, NO versionados).
# Se pueden usar indistintamente — ambos están en .gitignore.
#   - .env          → formato Docker (recomendado, compatible con --env-file)
#   - .env.properties → formato Spring legado (compatibilidad con setups anteriores)
#   - .env-${spring.profiles.active:dev}.properties → formato compatible desde consola
# Para crear el tuyo: cp .env.example .env
# ==============================================================================

spring:
  config:
    import:
      - "optional:file:./.env[.properties]"
      - "optional:file:./.env.properties"
      - "optional:file:./.env-${spring.profiles.active:dev}.properties"
      # Rutas de controladores por bounded context: cada modulo infrastructure trae su propio
      # archivo, para poder llevarselo intacto si ese contexto se extrae a microservicio.
      - "classpath:rutas-seguridad.yml"
      - "classpath:rutas-usuarios.yml"
      - "classpath:rutas-fichas.yml"
      - "classpath:rutas-proyectos.yml"
      - "classpath:rutas-evaluaciones.yml"
      - "classpath:rutas-solicitudes.yml"
      - "classpath:rutas-artefactos.yml"
      - "classpath:rutas-repositorio-artefactos.yml"
      - "classpath:rutas-mapas-ruta.yml"
      - "classpath:rutas-entregables.yml"
      # Tabla de equivalencias del adaptador role-table (emisor legado); se borra junto con el.
      - "classpath:autorizacion-equivalencias.yml"
  banner:
    location: classpath:banner.txt
  application:
    name: arquisoft
    version: 1.0.0

  # ==================== VIRTUAL THREADS (ADR-008) ====================
  # Java 21 + Spring Boot 4.x: habilita virtual threads en Tomcat, @Async y RabbitMQ listeners.
  # Beneficio: I/O bloqueante (Keycloak, JDBC, Redis) sin consumo de OS threads.
  threads:
    virtual:
      enabled: true

  # ==================== DESHABILITAR AUTOCONFIGURACIÓN DE DATASOURCE GLOBAL ====================
  # Cada bounded context configura su propio DataSource, EntityManagerFactory y Flyway
  # en su clase *DataSourceConfig.java dentro de infrastructure/config/.
  # Sin esta exclusión, Spring Boot intentaría autoconfigurar un DataSource primario
  # y fallaría con NoUniqueBeanDefinitionException al encontrar 7 beans DataSource.
  # ==================== DESHABILITAR AUTOCONFIGURACIÓN DE DATASOURCE GLOBAL ====================
  # Spring Boot 4.x movió la autoconfiguración a jars/paquetes separados respecto a SB 3.x.
  # Los nombres SB 3.x (org.springframework.boot.autoconfigure.*) ya NO existen y se ignoran
  # silenciosamente — causan que los beans se activen aunque estén "excluidos".
  autoconfigure:
    exclude:
      # spring-boot-jdbc (era spring-boot-autoconfigure.jdbc en SB 3.x)
      - org.springframework.boot.jdbc.autoconfigure.DataSourceAutoConfiguration
      # spring-boot-hibernate (era spring-boot-autoconfigure.orm.jpa en SB 3.x)
      - org.springframework.boot.hibernate.autoconfigure.HibernateJpaAutoConfiguration
      # spring-boot-data-jpa — cada contexto configura sus repos via @EnableJpaRepositories
      - org.springframework.boot.data.jpa.autoconfigure.DataJpaRepositoriesAutoConfiguration
      # FlywayAutoConfiguration: no existe en classpath (no hay spring-boot-starter-flyway).
      # Cada contexto instancia su propio Flyway bean en su *DataSourceConfig.
      # JdbcEventPublicationAutoConfiguration: excluir el bean por defecto de Modulith
      # porque usamos ContextAwareEventPublicationRepository personalizado.
      - org.springframework.modulith.events.jdbc.JdbcEventPublicationAutoConfiguration

  # ==================== SPRING MODULITH (Outbox Pattern) ====================
  # Spring Modulith persiste los DomainEvents en event_publication (misma transacción
  # que el save del aggregate) y los publica al broker tras el commit.
  modulith:
    events:
      # delete: borra las filas exitosas — la tabla solo contiene pendientes/fallidos.
      # Alternativa: archive (conserva todo para auditoría, pero la tabla crece indefinidamente).
      completion-mode: delete
      # Al reiniciar, republica los eventos con completion_date = NULL que quedaron
      # pendientes por caída del broker u otro fallo en publicación.
      republish-outstanding-events-on-restart: true
      jdbc:
        schema-initialization.enabled: false
      staleness:
        # Frecuencia con la que Spring Modulith revisa si hay eventos atascados.
        check-intervall: 1m
        # Marca como FAILED los eventos que llevan más de 2m en estado PROCESSING
        # (e.g. app crasheó durante la publicación).
        processing: 2m
        # Marca como FAILED los eventos que llevan más de 10m en estado RESUBMITTED
        # (e.g. app crasheó durante un reintento iniciado por FailedEventRetryConfig).
        resubmission: 10m

  # ==================== RABBITMQ ====================
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:guest}
    password: ${RABBITMQ_PASSWORD:guest}
    virtual-host: /
    # Publisher Confirms: el broker confirma (ACK) o rechaza (NACK) cada mensaje publicado.
    # Requerido para que RabbitMQEventPublisher detecte mensajes no entregados al broker.
    publisher-confirm-type: correlated
    # Publisher Returns: si el broker no puede enrutar el mensaje a ninguna cola, lo devuelve.
    publisher-returns: true
    listener:
      simple:
        # Manual ACK: el mensaje permanece en 'unacknowledged' hasta que el consumer
        # llama basicAck. Si el consumer falla o muere, RabbitMQ re-entrega el mensaje.
        acknowledge-mode: manual
        # prefetch=1: el broker envía un mensaje a la vez por consumer.
        # Garantiza backpressure — un consumer lento no acumula mensajes sin procesar.
        prefetch: 1
        concurrency: 5
        max-concurrency: 10

  # ==================== REDIS ====================
  # CORRECCIÓN: En Spring Boot 3.x+ la clave cambió de spring.redis a spring.data.redis
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      username: ${REDIS_USER:default}
      password: ${REDIS_PASSWORD:}
      timeout: 2000ms
      lettuce:
        pool:
          max-active: 10
          max-idle: 5
          min-idle: 0

# ==================== NOTIFICACIONES (envío de correos) ====================
# 'proveedor' decide qué implementación de NotificationSender queda activa:
#   log  → LoggingNotificationSender: registra y NO entrega. Es el valor por defecto a propósito,
#          para que un entorno mal configurado nunca escriba a una persona real.
#   smtp → SmtpNotificationSender: entrega vía spring.mail.*, que sirve para Brevo, Gmail o
#          Mailpit sin tocar código — solo cambian host, puerto y credenciales.
# Agregar un proveedor con API REST es añadir una clase con @ConditionalOnProperty y su valor;
# ni el dominio ni la aplicación se enteran.
notificacion:
  proveedor: ${NOTIFICACION_PROVEEDOR:smtp}
  remitente-email: ${NOTIFICACION_REMITENTE_EMAIL:no-reply@arquisoft.local}
  remitente-nombre: ${NOTIFICACION_REMITENTE_NOMBRE:Arquisoft}
  # Clave de Redis, cargada por plantillas/cargar.sh. Espacio propio: el podador del catalogo
  # escanea "<contexto>.*" y borraria la plantilla si colgara de "notificaciones.".
  plantilla: ${NOTIFICACION_PLANTILLA:plantilla.correo-base}
  # Relee la plantilla de Redis cada intervalo, para ajustar el maquetado sin desplegar. Solo
  # publica la version nueva si conserva los tres huecos; si no, se queda con la anterior.
  plantilla-refresco:
    habilitado: ${NOTIFICACION_PLANTILLA_REFRESCO:true}
    intervalo: ${NOTIFICACION_PLANTILLA_REFRESCO_INTERVALO:PT5M}
  # Un envio rechazado se guarda como FALLIDA y lo reintenta un job programado, no el consumidor:
  # con prefetch=1 reintentar dentro del listener bloquearia la cola, y reencolar el evento no
  # sirve porque la idempotencia por event_id lo daria por duplicado sin reenviarlo.
  reintento:
    max-intentos: ${NOTIFICACION_REINTENTO_MAX_INTENTOS:5}
    limite-por-ciclo: ${NOTIFICACION_REINTENTO_LIMITE:50}
    intervalo: ${NOTIFICACION_REINTENTO_INTERVALO:PT5M}

# ==================== SMTP ====================
# Valores por defecto apuntando a Mailpit (docker-compose): captura los correos en local
# sin enviar nada a internet. En prod: smtp-relay.brevo.com:587 con auth y STARTTLS.
spring.mail:
  host: ${MAIL_HOST:localhost}
  port: ${MAIL_PORT:1025}
  username: ${MAIL_USERNAME:}
  password: ${MAIL_PASSWORD:}
  properties:
    mail:
      smtp:
        auth: ${MAIL_SMTP_AUTH:false}
        starttls:
          enable: ${MAIL_SMTP_STARTTLS:false}

# ==================== MINIO (Object Storage) ====================
# El archivo nunca pasa por el backend: este firma un formulario POST con politica y el navegador sube
# directo a MinIO. endpoint-publico es el host que alcanza el navegador (el endpoint del backend, p. ej.
# http://minio:9000 en compose, no); la firma de un POST con politica no cubre el host.
minio:
  endpoint: ${MINIO_ENDPOINT:http://localhost:9000}
  endpoint-publico: ${MINIO_PUBLIC_ENDPOINT:http://localhost:9000}
  access-key: ${MINIO_ACCESS_KEY:minioadmin}
  secret-key: ${MINIO_SECRET_KEY:minioadmin}
  presigned-url-expiry:
    formulario-carga-minutos: ${MINIO_UPLOAD_EXPIRY_MINUTES:15}

# ==================== REPOSITORIO DE ARTEFACTOS (almacenamiento) ====================
# El bucket lo crea minio/configurar.sh, nunca el backend. El maximo es por plantilla (5 MB); los 50 MB
# de ADR-004 son una cuota total por proyecto de grado en artefactos, no un limite por archivo.
repositorio-artefactos:
  almacenamiento:
    bucket: ${REPOSITORIO_ARTEFACTOS_BUCKET:repositorio-artefactos}
    tamano-maximo-bytes: ${REPOSITORIO_ARTEFACTOS_TAMANO_MAXIMO_BYTES:5242880}

# ==================== ARTEFACTOS (almacenamiento) ====================
# Bucket propio de artefactos (lo crea minio/configurar.sh), con los prefijos pendientes/ y versiones/.
artefactos:
  almacenamiento:
    bucket: ${ARTEFACTOS_BUCKET:artefactos}
    tamano-maximo-bytes: ${ARTEFACTOS_TAMANO_MAXIMO_BYTES:5242880}

