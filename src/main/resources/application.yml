arquisoft:
  # Trazabilidad (shared:tracing). Claves MDC emitidas como campos JSON de primer nivel en
  # perfil prod: correlacionId, transaccionId, origen, usuarioId, clienteIp, metodoHttp,
  # rutaUri, tiempoEntrada; y solo en la linea AUDIT: codigoEstado, duracionMs, tiempoSalida.
  trazas:
    # La IP completa esta cubierta por la base legal de interes legitimo (seguridad y abuso
    # de la API). Activar para anonimizar el ultimo octeto IPv4 / truncar IPv6 a /48.
    anonimizar-ip: ${TRAZAS_ANONIMIZAR_IP:false}
    rutas-excluidas-auditoria: /api/actuator/,/api/swagger-ui,/api/v3/api-docs,/api/swagger-resources

  events:
    # Intervalo entre reintentos de eventos con estado FAILED.
    # Formato ISO-8601: PT5M = 5 minutos, PT30S = 30 segundos.
    failed-retry-interval: PT5M

  # Catálogo de mensajes (ADR-013). Intervalo del monitor que reintenta la conexión con Redis
  # cuando el catálogo quedó degradado. Solo consulta Redis mientras está en ese estado.
  catalogo:
    reintento-intervalo: PT30S

  # Limitador de peticiones. Mismo patrón que el catálogo: cuando Redis cae, el limitador degrada
  # a cuota local por instancia y este monitor es quien lo devuelve a la cuota distribuida.
  limite-solicitudes:
    reintento-intervalo: PT30S

# ==================== SERVER ====================
# ==================== CORS Y RATE LIMITING (BASE) ====================
# En la RAIZ, no bajo 'arquisoft:'. Quien las lee espera exactamente estos prefijos:
# LimiteSolicitudesProperties bindea @ConfigurationProperties("security.rate-limit") y
# CorsConfig resuelve @Value("${security.cors.*}"). Anidadas bajo 'arquisoft:' quedaban
# como 'arquisoft.security.*' y no las veia nadie: los valores efectivos salian de
# application-dev.yml / application-prod.yml, que si las declaran en la raiz, y estos
# supuestos "valores base" no eran base de nada.
security:
  # false: el filtro de autorizacion no se instala (equivale al modo none para todos los emisores);
  # la autenticacion del Bearer sigue exigida. Prohibido en el perfil prod.
  enabled: ${SECURITY_ENABLED:true}
  # Defaults por perfil de los valores que viven dentro de la lista de emisores (un perfil no
  # puede sobrescribir un elemento de una lista, pero si estos escalares).
  defaults:
    legacy-enabled: false
    issuer-uri: ""
  # Resource server multi-emisor. Cada emisor valida sus JWT por JWKS y se autoriza con el
  # adaptador de su campo 'authorization' (pep | role-table | none). Ningun permiso viaja en el token.
  authentication:
    issuers:
      - id: principal
        enabled: true
        issuer: ${AUTH_ISSUER_URI:${security.defaults.issuer-uri}}
        jwks-uri: ${AUTH_JWKS_URI:}
        audiences: ${AUTH_AUDIENCES:}
        authorization: ${AUTH_AUTHORIZATION:pep}
        blacklist: false
        claims:
          id: sub
          correo: email
          nombre-usuario: preferred_username
          nombre: name
          roles: ${AUTH_CLAIM_ROLES:}
      # Emisor actual, solo mientras dure la transicion: se apaga con AUTH_LEGACY_ENABLED=false.
      - id: legado
        enabled: ${AUTH_LEGACY_ENABLED:${security.defaults.legacy-enabled}}
        issuer: ${KEYCLOAK_URL:http://localhost:8081}/realms/${KEYCLOAK_REALM:arquisoft}
        audiences: ${KEYCLOAK_EXPECTED_AUDIENCE:arquisoft-api}
        authorization: role-table
        blacklist: true
        claims:
          id: sub
          correo: email
          nombre-usuario: preferred_username
          nombre: name
          roles: realm_access.roles
  authorization:
    public-paths: ${SECURITY_PUBLIC_PATHS:/actuator/health/**,/actuator/prometheus,/swagger-ui/**,/v3/api-docs/**,/swagger-resources/**}
    authenticated-paths: ${SECURITY_AUTHENTICATED_PATHS:/auth/logout}
    resource:
      path-mode: ${AUTHORIZATION_PATH_MODE:template}
      path-prefix: ${AUTHORIZATION_PATH_PREFIX:${server.servlet.context-path:}}
    pep:
      url: ${PEP_URL:}
      application-name: ${PEP_APPLICATION_NAME:}
      environment: ${PEP_ENVIRONMENT:}
      credential: ${PEP_REGISTRATION_TOKEN:}
      allow-insecure-http: ${PEP_ALLOW_INSECURE_HTTP:false}
      connect-timeout: ${PEP_CONNECT_TIMEOUT:1s}
      read-timeout: ${PEP_READ_TIMEOUT:3s}
      max-retries: ${PEP_MAX_RETRIES:0}
      retry-backoff: ${PEP_RETRY_BACKOFF:200ms}
    # Resolucion de client roles del emisor role-table: el token lleva solo realm roles y el backend
    # consulta en Redis un indice client role -> realm roles que lo otorgan, refrescado desde la
    # Admin API del proveedor. Sin emisor role-table habilitado no hace nada y client-uuid no se exige.
    role-expansion:
      refresh-interval: ${ROLE_EXPANSION_REFRESH_INTERVAL:PT5M}
      ttl: ${ROLE_EXPANSION_TTL:PT15M}
      check-interval: ${ROLE_EXPANSION_CHECK_INTERVAL:PT30S}
      lock-lease: ${ROLE_EXPANSION_LOCK_LEASE:PT60S}
      keycloak:
        server-url: ${KEYCLOAK_URL:http://localhost:8081}
        realm: ${KEYCLOAK_REALM:arquisoft}
        client-id: ${KEYCLOAK_CLIENT_ID:arquisoft-api}
        client-secret: ${KEYCLOAK_CLIENT_SECRET:}
        client-uuid: ${KEYCLOAK_CLIENT_UUID:}
        connect-timeout: ${ROLE_EXPANSION_CONNECT_TIMEOUT:2s}
        read-timeout: ${ROLE_EXPANSION_READ_TIMEOUT:3s}
  # Login directo y aprovisionamiento de usuarios contra el proveedor actual (keycloak | none).
  direct-login:
    provider: ${DIRECT_LOGIN_PROVIDER:keycloak}
    keycloak:
      server-url: ${KEYCLOAK_URL:http://localhost:8081}
      realm: ${KEYCLOAK_REALM:arquisoft}
      client-id: ${KEYCLOAK_CLIENT_ID:arquisoft-api}
      client-secret: ${KEYCLOAK_CLIENT_SECRET:}
  identity-provisioning:
    provider: ${IDENTITY_PROVISIONING_PROVIDER:keycloak}
    keycloak:
      server-url: ${KEYCLOAK_URL:http://localhost:8081}
      realm: ${KEYCLOAK_REALM:arquisoft}
      client-id: ${KEYCLOAK_CLIENT_ID:arquisoft-api}
      client-secret: ${KEYCLOAK_CLIENT_SECRET:}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:4200,http://localhost:5173}
    allowed-methods: ${CORS_ALLOWED_METHODS:GET,POST,PUT,DELETE,OPTIONS,PATCH}
    allowed-headers: ${CORS_ALLOWED_HEADERS:Authorization,Content-Type,X-Correlation-Id}
    max-age: ${CORS_MAX_AGE:3600}
    allow-credentials: ${CORS_ALLOW_CREDENTIALS:false}
  rate-limit:
    enabled: ${RATE_LIMIT_ENABLED:true}
    requests-per-minute: ${RATE_LIMIT_REQUESTS_PER_MINUTE:100}
    login-requests-per-minute: ${RATE_LIMIT_LOGIN_REQUESTS_PER_MINUTE:5}
    # Tope de la cuota local que sustituye a Redis mientras esta caido. Vuelve la propiedad
    # que se dio de baja al migrar a RedisBucketResolver: con una cache en memoria por IP,
    # sin tope una caida de Redis se convierte en un vector de agotamiento de memoria.
    max-tracked-ips: ${RATE_LIMIT_MAX_TRACKED_IPS:10000}

server:
  port: 8080
  servlet:
    context-path: /api
  # ForwardedHeaderFilter de Spring valida X-Forwarded-For/X-Real-IP contra trusted-proxies
  # antes de reescribir request.getRemoteAddr() — evita IP spoofing desde internet.
  # TrazabilidadFilter lee solo request.getRemoteAddr() y obtiene la IP real del cliente.
  forward-headers-strategy: FRAMEWORK
  compression:
    enabled: true
    min-response-size: 1024

# ==================== LOGGING ====================
# logback-spring.xml gestiona appenders, formato, rotación y AsyncAppender.
# Aquí solo se declaran niveles — el resto (file.name, pattern.*, logback.rollingpolicy.*)
# no tiene efecto cuando existe un logback-spring.xml custom y genera confusión.
logging:
  # Grupos: un nombre de negocio por familia de loggers, para poder subir o bajar el nivel de
  # toda la familia con UNA variable. Es necesario, no cosmetico: por variable de entorno el
  # binding relajado de Spring Boot solo llega a nivel de PAQUETE, nunca de clase, asi que sin
  # grupos no hay forma de tocar `org.hibernate.SQL` y `org.hibernate.type` a la vez desde .env.
  group:
    negocio: com.arquisoft.fichas, com.arquisoft.seguridad, com.arquisoft.usuarios, com.arquisoft.notificaciones, com.arquisoft.evaluaciones, com.arquisoft.proyectos, com.arquisoft.solicitudes, com.arquisoft.biblioteca, com.arquisoft.repositorio_artefactos, com.arquisoft.artefactos, com.arquisoft.mapas_ruta, com.arquisoft.entregables
    plataforma: com.arquisoft.shared
    datos: org.hibernate.SQL, org.hibernate.type
    seguridad: org.springframework.security
    mensajeria: org.springframework.amqp, com.rabbitmq, org.springframework.modulith
    framework: org.springframework.web, org.springframework.data, org.hibernate, com.zaxxer.hikari, org.flywaydb, org.apache.tomcat, io.micrometer
  # El default de cada variable lo pone el perfil activo (application-dev.yml /
  # application-prod.yml). Estos son los de "sin perfil": arranque suelto y slices de test.
  level:
    root: ${LOG_NIVEL_ROOT:INFO}
    negocio: ${LOG_NIVEL_NEGOCIO:INFO}
    plataforma: ${LOG_NIVEL_PLATAFORMA:INFO}
    datos: ${LOG_NIVEL_DATOS:OFF}
    seguridad: ${LOG_NIVEL_SEGURIDAD:INFO}
    mensajeria: ${LOG_NIVEL_MENSAJERIA:INFO}
    framework: ${LOG_NIVEL_FRAMEWORK:INFO}
  # servicioNombre y version NO van al MDC: son constantes del proceso, no contexto de la
  # peticion. El formateador logstash de Spring Boot 4 solo serializa el MDC y los
  # KeyValuePairs del evento — nunca las propiedades de contexto de Logback, asi que
  # <springProperty scope="context"> no funcionaria aqui. StructuredLogEncoder resuelve
  # estas propiedades desde el Environment aunque el encoder se declare en logback-spring.xml.
  structured:
    json:
      add:
        servicioNombre: ${spring.application.name}
        version: ${spring.application.version}


# ==================== ACTUATOR ====================
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always
  # Health check de correo DESACTIVADO a proposito (2026-08-27).
  # notificacion.proveedor=log no envia correos, pero spring.mail sigue
  # autoconfigurando JavaMailSender y su MailHealthIndicator, que intenta
  # conectarse a Mailpit (localhost:1025) — un contenedor que solo existe en el
  # docker-compose local. En el servidor eso deja /actuator/health en DOWN y hace
  # fallar el health check del despliegue.
  # Reactivar (borrar este bloque) cuando se defina el SMTP real: la config de
  # spring.mail se conserva intacta mas arriba.
  health:
    mail:
      enabled: false
  metrics:
    export:
      prometheus:
        enabled: true

# ==================== SPRINGDOCS ====================
springdoc:
  swagger-ui:
    enabled: true
  api-docs:
    enabled: true
  default-flat-param-object: true