# ==============================================================================
# CONFIGURACION BASE DE ARQUISOFT
# ==============================================================================
# Importa credenciales desde .env.properties (archivo local, NO versionado).
# Si el archivo no existe, se usan los defaults vacios (el arranque fallara
# con mensaje claro de conexion).
# Para crear el tuyo: cp .env.properties.example .env.properties
# ==============================================================================

spring:
  config:
    import: "optional:file:./.env.properties"

  application:
    name: arquisoft

  # ==================== VIRTUAL THREADS (ADR-008) ====================
  # Java 21 + Spring Boot 4.x: habilita virtual threads en Tomcat, @Async y RabbitMQ listeners.
  # Beneficio: I/O bloqueante (Keycloak, JDBC, Redis) sin consumo de OS threads.
  threads:
    virtual:
      enabled: true

  # ==================== BASE DE DATOS ====================
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/arquisoft}
    username: ${DB_USERNAME:}
    password: ${DB_PASSWORD:}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 20000

  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
        jdbc:
          batch_size: 25
    open-in-view: false
    show-sql: false

  # ==================== FLYWAY ====================
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  # ==================== RABBITMQ ====================
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:guest}
    password: ${RABBITMQ_PASSWORD:guest}
    virtual-host: /
    listener:
      simple:
        acknowledge-mode: auto
        concurrency: 5
        max-concurrency: 10

  # ==================== REDIS ====================
  redis:
    host: ${REDIS_HOST:localhost}
    port: ${REDIS_PORT:6379}
    timeout: 2000
    jedis:
      pool:
        max-active: 10
        max-idle: 5
        min-idle: 0

# ==================== KEYCLOAK ====================
keycloak:
  auth-server-url: ${KEYCLOAK_AUTH_SERVER_URL}
  realm: ${KEYCLOAK_REALM}
  resource: ${KEYCLOAK_CLIENT_ID}
  credentials:
    secret: ${KEYCLOAK_CLIENT_SECRET}
  principal-attribute: preferred_username #Simplemente te hara la vida fácil

# ==================== SEGURIDAD ====================
security:
  cors:
    allowed-origins: http://localhost:3000,http://localhost:4200,http://localhost:5173
  rate-limit:
    enabled: false

# ==================== SERVER ====================
server:
  port: 8080
  servlet:
    context-path: /api
  compression:
    enabled: true
    min-response-size: 1024

# ==================== LOGGING ====================
logging:
  level:
    root: INFO
    org.springframework.web: INFO
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} - %msg%n"
    file: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"
  file:
    name: logs/arquisoft.log
    max-size: 10MB
    max-history: 10

# ==================== ACTUATOR ====================
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always
  metrics:
    export:
      prometheus:
        enabled: true

# ==================== SPRINGDOCS ====================
springdoc:
  swagger-ui:
    enabled: true
  api-docs:
    enabled: true
