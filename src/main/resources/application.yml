# ==================== KEYCLOAK ====================
# Propiedades propias para KeycloakAuthAdapter y SecurityConfig.
# No se usa el adapter keycloak-spring-boot-adapter (removido en SB3+).
# La validación JWT usa Spring Security OAuth2 Resource Server de forma nativa.
arquisoft:
  # Trazabilidad (shared:tracing). Claves MDC emitidas como campos JSON de primer nivel en
  # perfil prod: correlacionId, transaccionId, origen, usuarioId, clienteIp, metodoHttp,
  # rutaUri, tiempoEntrada; y solo en la linea AUDIT: codigoEstado, duracionMs, tiempoSalida.
  trazas:
    # La IP completa esta cubierta por la base legal de interes legitimo (seguridad y abuso
    # de la API). Activar para anonimizar el ultimo octeto IPv4 / truncar IPv6 a /48.
    anonimizar-ip: ${TRAZAS_ANONIMIZAR_IP:false}
    rutas-excluidas-auditoria: /api/actuator/,/api/swagger-ui,/api/v3/api-docs,/api/swagger-resources

  keycloak:
    server-url: ${KEYCLOAK_URL:http://localhost:8081}
    realm: ${KEYCLOAK_REALM:arquisoft}
    client-id: ${KEYCLOAK_CLIENT_ID:arquisoft-api}
    client-secret: ${KEYCLOAK_CLIENT_SECRET:}
    expected-audience: ${KEYCLOAK_EXPECTED_AUDIENCE:arquisoft-api}

  events:
    # Intervalo entre reintentos de eventos con estado FAILED.
    # Formato ISO-8601: PT5M = 5 minutos, PT30S = 30 segundos.
    failed-retry-interval: PT5M

  # Catálogo de mensajes (ADR-013). Intervalo del monitor que reintenta la conexión con Redis
  # cuando el catálogo quedó degradado. Solo consulta Redis mientras está en ese estado.
  catalogo:
    reintento-intervalo: PT30S

# ==================== SERVER ====================
# ==================== CORS Y RATE LIMITING (BASE) ====================
# En la RAIZ, no bajo 'arquisoft:'. Quien las lee espera exactamente estos prefijos:
# LimiteSolicitudesProperties bindea @ConfigurationProperties("security.rate-limit") y
# CorsConfig resuelve @Value("${security.cors.*}"). Anidadas bajo 'arquisoft:' quedaban
# como 'arquisoft.security.*' y no las veia nadie: los valores efectivos salian de
# application-dev.yml / application-prod.yml, que si las declaran en la raiz, y estos
# supuestos "valores base" no eran base de nada.
security:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:4200,http://localhost:5173}
    allowed-methods: ${CORS_ALLOWED_METHODS:GET,POST,PUT,DELETE,OPTIONS,PATCH}
    allowed-headers: ${CORS_ALLOWED_HEADERS:Authorization,Content-Type}
    max-age: ${CORS_MAX_AGE:3600}
    allow-credentials: ${CORS_ALLOW_CREDENTIALS:false}
  rate-limit:
    enabled: ${RATE_LIMIT_ENABLED:true}
    requests-per-minute: ${RATE_LIMIT_REQUESTS_PER_MINUTE:100}
    login-requests-per-minute: ${RATE_LIMIT_LOGIN_REQUESTS_PER_MINUTE:5}

server:
  port: 8080
  servlet:
    context-path: /api
  # ForwardedHeaderFilter de Spring valida X-Forwarded-For/X-Real-IP contra trusted-proxies
  # antes de reescribir request.getRemoteAddr() — evita IP spoofing desde internet.
  # TrazabilidadFilter lee solo request.getRemoteAddr() y obtiene la IP real del cliente.
  forward-headers-strategy: FRAMEWORK
  compression:
    enabled: true
    min-response-size: 1024

# ==================== LOGGING ====================
# logback-spring.xml gestiona appenders, formato, rotación y AsyncAppender.
# Aquí solo se declaran niveles — el resto (file.name, pattern.*, logback.rollingpolicy.*)
# no tiene efecto cuando existe un logback-spring.xml custom y genera confusión.
logging:
  level:
    root: INFO
    org.springframework.web: INFO
  # servicioNombre y version NO van al MDC: son constantes del proceso, no contexto de la
  # peticion. El formateador logstash de Spring Boot 4 solo serializa el MDC y los
  # KeyValuePairs del evento — nunca las propiedades de contexto de Logback, asi que
  # <springProperty scope="context"> no funcionaria aqui. StructuredLogEncoder resuelve
  # estas propiedades desde el Environment aunque el encoder se declare en logback-spring.xml.
  structured:
    json:
      add:
        servicioNombre: ${spring.application.name}
        version: ${spring.application.version}


# ==================== ACTUATOR ====================
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always
  # Health check de correo DESACTIVADO a proposito (2026-08-27).
  # notificacion.proveedor=log no envia correos, pero spring.mail sigue
  # autoconfigurando JavaMailSender y su MailHealthIndicator, que intenta
  # conectarse a Mailpit (localhost:1025) — un contenedor que solo existe en el
  # docker-compose local. En el servidor eso deja /actuator/health en DOWN y hace
  # fallar el health check del despliegue.
  # Reactivar (borrar este bloque) cuando se defina el SMTP real: la config de
  # spring.mail se conserva intacta mas arriba.
  health:
    mail:
      enabled: false
  metrics:
    export:
      prometheus:
        enabled: true

# ==================== SPRINGDOCS ====================
springdoc:
  swagger-ui:
    enabled: true
  api-docs:
    enabled: true
  default-flat-param-object: true