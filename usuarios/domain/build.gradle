dependencies {
    implementation project(':shared:domain')

    // Domain puro: sin dependencias de framework
    // - Las excepciones de dominio extienden DomainException (shared:domain → exceptions)
    // - UsuarioRole reside en shared:domain (compartido con seguridad)

    // Test: AssertJ + JUnit launcher (versiones gestionadas por BOM heredado del raiz)
    testImplementation "org.assertj:assertj-core"

    // Mockito para los tests de las reglas de dominio: sin el, cada regla exige un
    // doble del puerto escrito a mano con todos sus metodos.
    testImplementation "org.mockito:mockito-core"
    testImplementation "org.mockito:mockito-junit-jupiter"
    testRuntimeOnly "org.junit.platform:junit-platform-launcher"
    testRuntimeOnly "org.junit.jupiter:junit-jupiter-engine"
}
