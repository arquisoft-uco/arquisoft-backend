services:
  loki:
    image: grafana/loki:2.9.0
    container_name: loki
    command: -config.file=/etc/loki/local-config.yaml
    networks:
      - coolify
    volumes:
      - loki-data:/loki
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:3100/ready || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=15d
      - --web.enable-remote-write-receiver
    networks:
      - coolify
    volumes:
      - prometheus-data:/prometheus
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:9090/-/healthy || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  alloy:
    image: grafana/alloy:latest
    container_name: alloy
    group_add:
      - "999"  # GID del grupo docker en el host — verificar con: stat -c '%g' /var/run/docker.sock
    volumes:
      # Docker socket: Alloy captura logs de todos los contenedores del host
      # directamente del motor Docker, sin volumen compartido con el backend.
      - /var/run/docker.sock:/var/run/docker.sock
      # config.alloy se copia manualmente al servidor vía SSH antes del primer deploy.
      # Ver docs/OBSERVABILIDAD_COOLIFY.md — sección "Pre-requisitos".
      - /opt/observability/config.alloy:/etc/alloy/config.alloy:ro
    command: run --storage.path=/var/lib/alloy/data /etc/alloy/config.alloy
    networks:
      - coolify
    depends_on:
      - loki
      - prometheus
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:12345/ready || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3

  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD:-admin}
      - GF_SERVER_ROOT_URL=https://grafana.arquisoft.duckdns.org
      - GF_SERVER_SERVE_FROM_SUB_PATH=false
    networks:
      - coolify
    depends_on:
      - loki
      - prometheus
    volumes:
      - grafana-data:/var/lib/grafana
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:3000/api/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    labels:
      - traefik.enable=true
      - traefik.http.middlewares.gzip.compress=true
      - traefik.http.middlewares.redirect-to-https.redirectscheme.scheme=https
      - traefik.http.routers.http-0-observability-grafana.entryPoints=http
      - traefik.http.routers.http-0-observability-grafana.middlewares=redirect-to-https
      - traefik.http.routers.http-0-observability-grafana.rule=Host(`grafana.arquisoft.duckdns.org`) && PathPrefix(`/`)
      - traefik.http.routers.http-0-observability-grafana.service=http-0-observability-grafana
      - traefik.http.routers.https-0-observability-grafana.entryPoints=https
      - traefik.http.routers.https-0-observability-grafana.middlewares=gzip
      - traefik.http.routers.https-0-observability-grafana.rule=Host(`grafana.arquisoft.duckdns.org`) && PathPrefix(`/`)
      - traefik.http.routers.https-0-observability-grafana.service=https-0-observability-grafana
      - traefik.http.routers.https-0-observability-grafana.tls=true
      - traefik.http.routers.https-0-observability-grafana.tls.certresolver=letsencrypt
      - traefik.http.services.http-0-observability-grafana.loadbalancer.server.port=3000
      - traefik.http.services.https-0-observability-grafana.loadbalancer.server.port=3000

networks:
  coolify:
    external: true

volumes:
  loki-data:
    external: true
    name: observability_loki-data
  prometheus-data:
    external: true
    name: observability_prometheus-data
  grafana-data:
    external: true
    name: observability_grafana-data